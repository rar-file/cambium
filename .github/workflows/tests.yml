name: tests

# Pull requests run the quick tests; main, every night and a manual run get all of them
# (tests/conftest.py says which are slow).  Tests run on the project's own Python (.python-version)
# with every package at the version in requirements.lock, the versions results are pinned to.
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: quick tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the scorecard reads the approved targets at their git tag
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -m "not slow" -q --durations=15

  all:
    name: all tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q --durations=25

  package:
    # pyproject.toml claims 3.12 to 3.14: build the wheel, install it with the newest packages its
    # ranges allow, and run the package's tests and the command on each
    name: package on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - name: install the wheel
        run: python -m pip install "$(ls dist/pycambium-*.whl)[test]"
      - name: the command, from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          cambium --version
          cambium species
          cambium grow --species birch --seed 1 --years 5 --export glb --out birch1 --quiet
          python -c "import cambium, cambium._engine as e; assert not e.SOURCE, cambium.__file__; print(cambium.__file__)"
      - run: python -m pytest tests/test_cambium.py -q

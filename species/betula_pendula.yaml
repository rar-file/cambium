# Silver birch, Betula pendula Roth.
#
# Every parameter the growth model reads is in this file.  Each value says
# where it comes from.  VERIFY = estimated or tuned by eye, not taken from a
# measurement; treat those as the first things to revisit.
#
# Key references
#   [P09]  Palubicki W., Horel K., Longay S., Runions A., Lane B., Mech R.,
#          Prusinkiewicz P. 2009. Self-organizing tree models for image
#          synthesis. ACM Trans. Graph. 28(3):58.
#   [BH84] Borchert R., Honda H. 1984. Control of development in the
#          bifurcating branch system of Tabebuia rosea. Bot. Gaz. 145:184-195.
#   [S64]  Shinozaki K., Yoda K., Hozumi K., Kira T. 1964. A quantitative
#          analysis of plant form - the pipe model theory. Jpn. J. Ecol. 14.
#   [M82]  Maillette L. 1982. Structural dynamics of silver birch. I. The
#          fates of buds; II. A matrix model of the bud population.
#          J. Appl. Ecol. 19:203-218, 219-238.
#   [A92]  Atkinson M.D. 1992. Betula pendula Roth and B. pubescens Ehrh.
#          Biological Flora of the British Isles. J. Ecol. 80:837-870.
#   [E97]  Eriksson H., Johansson U., Kiviste A. 1997. A site-index model for
#          pure and mixed stands of Betula pendula and B. pubescens in Sweden.
#          Scand. J. For. Res. 12:149-156.
#   [H05]  Hemery G.E., Savill P.S., Pryor S.N. 2005. Applications of the
#          crown diameter-stem diameter relationship for different species of
#          broadleaved trees. For. Ecol. Manage. 215:285-294.
#   [H10]  Hynynen J. et al. 2010. Silviculture of birch in northern Europe.
#          Forestry 83:103-119.
#   [CK66] Clausen J.J., Kozlowski T.T. 1965. Heterophyllous shoots in
#          Betula papyrifera. Nature 205:1030.  Early and late leaves of birch
#          long shoots; short shoots with unelongated internodes.
#   [J00]  Jirasek C., Prusinkiewicz P., Moulia B. 2000. Integrating
#          biomechanics into developmental plant models expressed using
#          L-systems. Plant Biomechanics 2000, 615-624.
#   [AF09] Almeras T., Fournier M. 2009. Biomechanical design and long-term
#          stability of trees. J. Theor. Biol. 256:370-381.
#   [L35]  Laitakari E. 1935. The root system of birch (Betula verrucosa and
#          odorata). Acta Forestalia Fennica 41.
#   [K04]  Koch G.W., Sillett S.C., Jennings G.M., Davis S.D. 2004. The limits
#          to tree height. Nature 428:851-854.
#   [P00]  Peltola H., Kellomaki S., Hassinen A., Granander M. 2000. Mechanical
#          stability of Scots pine, Norway spruce and birch: an analysis of
#          tree-pulling experiments in Finland. For. Ecol. Manage. 135:143-153.
#   [C86]  Coutts M.P. 1986. Components of tree stability in Sitka spruce on
#          peaty gley soil. Forestry 59:173-197.
#   [D05]  Danjon F., Fourcaud T., Bert D. 2005. Root architecture and
#          wind-firmness of mature Pinus pinaster. New Phytol. 168:387-400.
#   [K22]  Krisans O., Caksa L., Matisons R., Rust S., Elferts D., Seipulis A.,
#          Jansons A. 2022. A static pulling test is a suitable method for
#          comparison of the loading resistance of silver birch between urban
#          and peri-urban forests. Forests 13:127.
#   [SS14] Rytter L., Karlsson A., Karlsson M., Stener L.-G. 2014. Skotsel av
#          bjork, al och asp. Skogsskotselserien nr 9, Skogsstyrelsen.
#   [HL19] Hagemeier M., Leuschner C. 2019. Functional crown architecture of
#          five temperate broadleaf tree species: vertical gradients in leaf
#          morphology, leaf angle, and leaf area density. Forests 10:265.
#   [OP22] Ounapuu-Pikas E., Venisse J.-S., Label P., Sellin A. 2022. Leaf and
#          branch hydraulic plasticity of two light-demanding broadleaved tree
#          species differing in water-use strategy. Forests 13:594.
#   [K18]  Klepsch M. et al. 2018. Is xylem of angiosperm leaves less resistant
#          to embolism than branches? J. Exp. Bot. 69:5611-5623.
#   [LA82] Laasasenaho J. 1982. Taper curve and volume functions for pine,
#          spruce and birch. Commun. Inst. For. Fenn. 108.

species:
  scientific_name: Betula pendula Roth
  common_name: silver birch

shoot:
  # One model metamer = one real node: internode + leaf + axillary bud.
  # Long-shoot internode length (m).  Birch long shoots carry their leaves in
  # two ranks with internodes of a few cm; the nearest measured value found
  # for Betula is 3.2 cm node spacing on 48 cm annual shoots of B. papyrifera
  # (US plant patent PP15768); weaker B. pendula shoots are shorter-jointed.
  # VERIFY
  internode_length: 0.025
  # Short-shoot internodes do not elongate beyond a few mm [CK66]; a short
  # shoot adds ~2 mm and 2-3 leaves a year.  Recorded for leaf placement;
  # short shoots are not meshed. VERIFY
  short_shoot_internode_length: 0.002
  # Longest annual shoot near the ground: ~1.2 m/yr, the upper end of
  # juvenile birch leader growth.  In metres; the number of metamers follows
  # from internode_length. VERIFY
  max_shoot_length: 1.2
  # Internode length and leaf size scale with turgor-driven expansion,
  # computed from leaf water potential (see hydraulics [K04]); this floor
  # keeps internodes at least ~5 mm. VERIFY
  min_expansion: 0.2
  # Shoots are kept this far above the ground plane (m). Model guard.
  min_height_above_ground: 0.05
  # A descending shoot apex below this height has reached the herb layer
  # and stops (contact, browsing). VERIFY
  ground_contact_height: 0.4
  # A shoot that would grow into the ground stops there (its bud is spent)
  # instead of turning along it, and tips in the ground layer stop unless
  # they are clearly climbing; false = deflect along the ground.
  stop_at_ground: true

resource:
  # Borchert-Honda resource at the base, v_base = alpha * Q_base [P09 Sec. 5.1].
  # Sets how many metamers an unshaded, fully watered bud can produce.
  # VERIFY (tuned to Swedish height curves [E97] and open-grown crown size [H05]).
  # 4.6 while respiration was ~3 % of the fixed carbon; re-tuned with explicit
  # respiration (CUE ~0.5), maintenance paid from the pool, the 3-metamer
  # long-shoot gate and self-financing short shoots (phase 15): at 5.6 the
  # plots' mean height is 19.2-19.7 / 23.3-23.7 / 25.6-25.7 m at 30 / 45 /
  # 60, top quarter 20.9-21.1 / 24.9-25.3 / 27.0-27.3 m (band 13.4-19.7 /
  # ~18-24 / 21.1-26.9); 6.0 put the plots' top quarter 2-3 m above the band.
  # Single seed 1 forks at the base at 5.2-5.6 (slow canopy closure), the
  # plot trees do not.
  # Carbon comes from leaves (phase 22): alpha is the carbon one reference
  # leaf (leaf_area_m2) fixes in full light in a year, in model units
  # (0.305 g C each, leaf_costs).  Set from sources, not from heights: a
  # 10-year Estonian silver-birch stand on fertile former farmland produced
  # 13.0 Mg/ha/yr (dry matter, leaves 2.81 Mg/ha) [Aosaar et al. 2016,
  # Table 4]; at SLA 15 m2/kg (Uri et al. 2007) LAI 4.2, at 0.48 g C/g and
  # CUE 0.45 GPP ~1390 g C/m2/yr, ~330 g C per m2 of leaf = ~1080 units.
  # The model's natural plot fixes that per m2 of leaf at LAI 3.9-4.05
  # (years 16-20) with alpha 4.8.  It is the fertile end: average Swedish
  # sites are less productive (phase 22: heights at 4.8 are far above the
  # band; nitrogen and season are not modelled).
  # VERIFY: 4.8 itself is not in Aosaar et al. 2016, which has no
  # photosynthesis, light or LAI data; only the NPP and leaf mass above are.
  # It is the value at which one model run (natural plot, years 16-20, commit
  # c3fd2dc) fixed the derived ~1080 units per m2 of leaf, so it is a one-point
  # model calibration that also rests on the SLA and CUE above, for a fertile
  # 10-year-old stand.  See reports/milestone_M1.md.
  alpha: 4.8
  # The BH split weight lambda [P09 Eq. 3, BH84] (lambda > 0.5 favours the
  # main axis) is used with two values, following the botanical distinction
  # between apical dominance (the apex suppressing its own lateral buds) and
  # apical control (the leader restraining established branches) (Brown,
  # McAlpine & Kormanik 1967, Am. J. Bot. 54:153; Wilson 2000, Am. J. Bot.
  # 87:601).  P09 uses a single lambda for both.
  # Apical dominance, used where the lateral is still a bud or spur.  Strong
  # in birch: most lateral buds stay short shoots [M82]. VERIFY: no source gives
  # this value; [P09] Sec. 4.2 illustrates lambda 0.46-0.54 only, on synthetic
  # trees (M1c).
  apical_dominance: 0.62
  # Apical control, used where the lateral is a branch.  Strong when young
  # (excurrent leader, conical crown), weaker when old (rounder, more open
  # crown) [A92].  Logistic transition between the two values.
  # VERIFY (all four)
  apical_control_young: 0.60
  apical_control_old: 0.50
  apical_control_transition_age: 22
  apical_control_transition_width: 6
  # Gravimorphism: shoot orientation changes vigour; upward shoots are more
  # vigorous than horizontal or hanging ones (Wareing & Nasr 1961, Ann.
  # Bot. 25:321).  BH weight of a bud = Q * max(0.05, 1 + g * d_z). VERIFY
  gravimorphism: 1.0
  # Physiological ageing of meristems (Barthelemy & Caraglio 2007, Ann.
  # Bot. 99:375): the sink strength of all buds on a first-order branch
  # decays as exp(-branch_age / branch_aging_years), so old scaffold branches
  # produce ever shorter shoots, lose out to the young upper crown and are
  # shed.  Buds on the stem age with the tree, more slowly; that is the loss
  # of apical control that rounds the top of an old birch [A92]. VERIFY
  branch_aging_years: 20
  stem_aging_years: 45
  # A limb's meristems start at the physiological age the stem had when it
  # made them [Barthelemy & Caraglio 2007], instead of at zero.  false: a
  # limb born at 45 near the top was 2.4x as vigorous as the 45-year-old
  # leader's buds and overtopped it (the V-shaped twin top).  Stand seed 1:
  # the leader then stays on top from 45 to 60 (it was overtopped by 1.25 m).
  limbs_inherit_stem_age: true
  # Loss of dominance and reiteration.  Birch crowns are hierarchic while
  # young; in the third phase "the branches and the extremity of the main stem
  # assume a divaricated structure with very short growth units" and the
  # trunk ends in forks (Millet, Bouchard & Edelin 1999, Ecoscience 6:187,
  # grey birch).  In Barthelemy & Caraglio's (2007) terms the adult crown is
  # built by reiteration: well-lit, vigorous upper limbs become reiterated
  # complexes, partly rejuvenated, with an orthotropic axis of their own
  # (ARCHI "duplication": the trunk gives rise to axes identical to itself in
  # its ageing sequence).  Triggers: the tree in its adult phase (min_age);
  # the leader's yearly growth below decline_fraction of its peak; the limb
  # attached in the upper
  # upper_crown_fraction of the crown, its tip lit at min_light or more and
  # at least min_relative_vigour of the leader's.  Reiteration is sequential:
  # the most vigorous eligible limb becomes a complex, the next one no sooner
  # than interval_years later.  A complex's physiological age is multiplied
  # by rejuvenation and then ages like the stem. VERIFY (all values: no
  # published thresholds found; interval_years set so that about six
  # complexes form between 30 and 60, as the 4-7 major limbs in the
  # reference photos)
  reiteration:
    enabled: true
    min_age: 30
    decline_fraction: 0.5
    upper_crown_fraction: 0.25
    min_light: 0.8
    min_relative_vigour: 0.3
    interval_years: 5
    rejuvenation: 0.5
    setpoint_angle_deg: 0
  # Maintenance cost of one living internode, in metamer units per year,
  # charged as resource flows acropetally (LIGNUM carbon balance,
  # Perttunen et al. 1996, Ann. Bot. 77:87).  Branches that cannot pay
  # for themselves starve and are shed.  Calibrated (with
  # growth_respiration_coefficient below) to a whole-tree carbon use
  # efficiency of ~0.47: seed 1 stand, mean CUE 0.50 over ages 20-60
  # (0.02 before gave 0.78 with growth respiration, ~0.96 without).
  # 0.7 -> 0.2 when leaves and fine roots were charged (phase 20); 0.5
  # with carbon from leaves and alpha 4.8 (phase 22): the natural plot's
  # CUE (all tree-years from age 20) 0.42 against the target ~0.45; to be
  # set again once allocation is settled.  VERIFY (calibrated)
  maintenance_per_internode: 0.5
  # Growth respiration: g C respired per g C built into new tissue (shoots,
  # wood, roots), ~0.25 (Ryan 1991, Ecol. Appl. 1:157; VERIFY).  New wood
  # and shoots are built from the carbon left after maintenance and growth
  # respiration; maintenance_per_internode is set so that the tree's carbon
  # use efficiency NPP/GPP is ~0.47, the value for temperate and boreal
  # forests (Waring et al. 1998, Tree Physiol. 18:129: 0.47 +- 0.04, range
  # 0.40-0.52; Collalti & Prentice 2019, Tree Physiol. 39:1473: 0.46 +-
  # 0.12; boreal at the low end, DeLucia et al. 2007, Glob. Change Biol.
  # 13:1157).
  growth_respiration_coefficient: 0.25
  # Leaves and fine roots are not free: birch rebuilds all its leaves every
  # spring, and leaves and fine roots respire all season.  Charged every year
  # from the tree's pool before the split, and in each branch's own carbon
  # balance (its wood and its leaves).
  leaf_costs:
    enabled: true
    # Grams per model carbon unit: the unit builds wood_volume_per_carbon of
    # wood (pipe_model), at the stemwood basic density of 0.53 g cm-3 of a
    # 17-year-old Estonian silver-birch stand [Aosaar et al. 2016, Silva
    # Fennica 50(4):1628] 0.64 g dry matter.
    wood_basic_density_kg_m3: 530.0
    # Carbon in dry matter, ~0.48 (Thomas & Martin 2012, Forests 3:332, Table 2,
    # p. 337: temperate/boreal angiosperm wood 48.8 +- 0.6 observed; 48 +- 2 is
    # the IPCC column they reprint).  Wood, not leaves.
    carbon_fraction: 0.48
    # Leaf maintenance respiration, g C per g leaf dry mass per year:
    # ~8 nmol CO2 g-1 s-1 in Betula pendula leaves [Oleksyn et al. 2000,
    # Trees 14:271], over a 150-day leafy season, from the measurement
    # temperature (20 C) to a season mean of 13.5 C with Q10 = 2:
    # 8e-9 x 12 x 86400 x 150 x 2^-0.65 = 0.79.  VERIFY (measurement
    # temperature, season length and mean, Q10)
    leaf_maintenance_gc_per_g: 0.79
    # Fine-root dry mass per leaf dry mass: 1.35 against 2.81 Mg ha-1 in a
    # 10-year-old silver-birch stand [Aosaar et al. 2016, Table 4].
    fine_root_to_leaf_mass: 0.48
    # Exploring only: charge next spring's clusters on fresh lateral buds (see _leaf_costs).
    charge_fresh_laterals: false
    # Fine-root maintenance respiration, g C per g per year: 2.5-7.7 nmol
    # CO2 g-1 s-1 at 10 C in boreal aspen, black spruce and jack pine
    # [Ryan, Lavigne & Gower 1997, J. Geophys. Res. 102:28871], 5 over a
    # 180-day season at ~10 C: 5e-9 x 12 x 86400 x 180 = 0.93.  VERIFY
    # (season, birch rate)
    fine_root_maintenance_gc_per_g: 0.93
  # Branch autonomy (Sprugel, Hinckley & Schaap 1991, Annu. Rev. Ecol.
  # Syst. 22:309): a first-order limb lives on the carbon its own leaves fix,
  # imports none and exports this fraction to the stem; the stem pool (the
  # stem's own leaves plus exports) feeds only the leader and the buds on
  # the stem.  Water stays shared through the roots.  A limb whose own
  # carbon cannot pay its upkeep is shed.  null = one shared pool (P09).
  # Tried at 0.1-0.35 without, and at 0.1-0.2 with, young-limb import: the
  # dominant limbs stay the seedling-era ones at the base and the leader
  # drops below the height band (see KNOWN_ISSUES.md).  Off.
  # VERIFY
  branch_export_fraction: null
  # Young limbs import from the stem pool (their Borchert-Honda share) until
  # their own carbon covers what they drew the year before, i.e. they have
  # become net exporters; then they run on their own budget.  No constant:
  # the switch is the limb's own carbon balance.
  young_limbs_import: true
  # Carbon split between crown and roots: functional balance (Brouwer 1963;
  # Thornley 1972 Ann. Bot. 36:431) sends more to the roots the more the
  # leaves are water-limited.  Root share runs from min (no water stress)
  # to max (stomata shut).  Birch allocates ~25-40 % of production below
  # ground including fine-root turnover. VERIFY
  root_share_min: 0.25
  root_share_max: 0.6
  # Root segments (segment_length each) built per unit of carbon, relative
  # to one shoot metamer. VERIFY
  root_segments_per_unit: 0.2

bud_fate:
  # A bud with v forms floor(v) metamers [P09].  Axis tips extend with v >= 1;
  # a lateral bud forms a long shoot with v >= this many metamers, otherwise
  # a short shoot.  Birch shoots are dimorphic: a lateral bud makes either a
  # short shoot (2-3 leaves on an unelongated axis) or a long shoot with
  # several elongated internodes [M82]; a bud that can afford only 1-2
  # metamers makes a short shoot.  P09's rule (1) was tried in phase 14: it
  # made 12x as many 1-2-node third-order shoots, doubled the local leaf
  # density around twig buds (3.8 -> 7.3 m2/m3 within 0.25 m) and halved the
  # survival of second-order shoots (99 -> 53 % after 5-8 years), seed 1 at
  # 25 years (phase 15). VERIFY (the value 3)
  long_shoot_threshold: 3.0
  # Axis tips extend continuously: shoot length is l0 * v, and a tip that
  # can afford less than one metamer still makes one shorter internode (it
  # used to stop: seedlings in the field layer, at ~38 % light, could afford
  # 0.9-1.0 metamers a year and never grew, phase 20).  Below this share of
  # a metamer (0.1 = 2.8 mm) a tip does not extend.  VERIFY (resolution)
  min_tip_extension: 0.1
  # A tip increment below one metamer is a short-shoot year: its leaf
  # stands at the tip and no long-shoot bud forms in its axil.  Birch short
  # shoots carry only their terminal bud (Betula grossa: Ishihara &
  # Kikuzawa 2009, Ann. Bot. 104:1195), and long-shoot buds form in the
  # axils of a long shoot's late leaves (B. papyrifera: "Shoot development
  # in Betula papyrifera III", Can. J. Bot. 1984, doi:10.1139/b84-066).
  # With axillary buds on every such
  # increment, weak tips stacked buds and short shoots at a few mm
  # (phase 26).
  axillary_buds_below_one_metamer: false
  # VERIFY.  Exploring only (M3a), off: Sievanen et al. 2018 Eq. 11's density term.  Its fitted values aren't
  # printed.  These two bracket birch crown leaf density, shade 0.3 and sun 3.2 m2/m3, Hagemeier &
  # Leuschner 2019 Table 5, as a test, not a claim.  The 0.5 m cell stands in for their 0.5 m cone.
  density_control:
    enabled: false
    af_full: 0.3
    af_zero: 3.2
    cell_m: 0.5
    after_growth: false
  # Short shoots are cheap and self-financing, so their fate is local and
  # driven by light, not by BH resource: a lateral bud that does not extend
  # forms a short shoot (spur) if its exposure Q reaches short_shoot_light;
  # most lateral buds of a birch long shoot become short shoots [M82].
  # A non-extending shoot tip also lives on as a short shoot while lit. VERIFY
  short_shoot_light: 0.30
  # A spur dies when its exposure falls below this: the lowermost shade
  # leaves of Betula pendula stands sit at 21 % relative light (median of
  # 120-150 measurements; Hagemeier & Leuschner 2019, Forests 10:925).
  short_shoot_survival_light: 0.21
  # A spur releases a long shoot only with clearly more resource than a fresh
  # bud; release of short shoots into long shoots is uncommon [M82]. VERIFY
  spur_release_threshold: 6.0
  # Short shoots are self-financing [M82]: they fix carbon with their own
  # leaves and are no sink in the Borchert-Honda split (no release then).
  # As sinks they took 73 % of the shoot resource (seed 1, years 15-30) and
  # wasted it, so sub-branches stopped extending after their first year:
  # 0.054 m2 of leaf and 0.51 cm at 12 years (phase 15).
  short_shoots_self_financing: true
  # A bud that will not grow this year (a tip below one metamer, a fresh
  # lateral below long_shoot_threshold) is no sink: the split is made again
  # among the buds that grow.  Without it, buds that became short shoots
  # took 45 % of the resource unused (seed 1, years 15-30; phase 15).
  idle_buds_no_sink: false
  # Published Borchert-Honda (Borchert & Honda 1984; Palubicki et al. 2009):
  # Uses constant apical dominance lambda without age-decaying apical control,
  # and pure basipetal resource sums without gravimorphic or scaffold vigour weighting.
  borchert_honda_published: false
  # Short-shoot lifespan in years; birch short shoots persist for several
  # years [M82].  null: no fixed lifespan, a short shoot dies only of light
  # (below short_shoot_survival_light); 8 years made the lower limbs of a
  # stand tree leafless once their aged meristems stopped making new ones.
  spur_lifespan: null
  # Years an unbroken lateral bud stays viable; birch builds few epicormic
  # shoots from old dormant buds [A92]. VERIFY
  dormant_bud_lifespan: 3

light:
  # Voxel edge (m) for shadow propagation [P09 Sec. 4.2]: ~4 internodes,
  # about one leaf length.  Results are insensitive to it because the shadow
  # per leaf is conserved: 0.1, 0.15 and 0.2 m give the same light
  # distribution. VERIFY
  voxel_size: 0.10
  # Shadow of one leaf in its own voxel is a = k * A_leaf / voxel_size^2
  # (Beer-Lambert).  Measured in closed Betula pendula stands: K_PAR 0.37
  # (steep leaf angles, clumping index 0.42; Hagemeier & Leuschner 2019,
  # Forests 10:925, Table 5), not the 0.5 of a spherical leaf-angle
  # distribution.  With 0.5 the stand floor got 35 % light at LAI 2.2; the
  # same stands measured 14.8 % (6.4-19.8) at LAI 4.6 with the lowest leaves
  # at ~21 %.  Their LAI came from litter traps (leaves only) and K_PAR from
  # measured PAR transmission against it, so K_PAR already holds the shade of
  # stems and branches: wood casts no shade of its own in the model (it would
  # be counted twice).  The model's ground light follows exp(-0.37 LAI)
  # within ~2 points (phase 20).
  # VERIFY: light.woody_shade below is now on and adds wood shade to this k,
  # which contradicts the lines above.  Whether it double-counts turns on how
  # K_PAR was computed; Forests 10:925 could not be opened in M1c.  Forests
  # 10:265 p. 5 confirms the LAI is leaves only.
  extinction_coefficient: 0.37
  # One-sided area of a silver-birch leaf (m^2): blades 3-7.5 cm long and
  # 1.5-6 cm wide (Flora of NSW; NC State Extension plant toolbox).  Current-
  # year birch shoots carry 167 cm2 of leaf on 27.9 cm of shoot [OP22]: at
  # 2.5 cm internodes (one leaf each) about 15 cm2 per leaf.
  leaf_area_m2: 0.0015
  # Sun and shade leaves.  Birch LMA rises with height in the crown,
  # LMA = 50.5 + 38.7 h^3.3 g m-2 (h relative height, adult trees in closed
  # stands; [HL19] Table 4), and its leaves are smallest in the uppermost sun
  # crown and grow larger with crown depth [HL19].  Here the leaf's relative
  # light q stands in for h.  Leaf size goes as (LMA_ref / LMA)^size exponent:
  # with exponent 1 every leaf has the same dry mass.  LMA_ref is the mean
  # shoot LMA of [OP22] (60.8 g m-2), where leaf_area_m2 above applies.
  # VERIFY (q for h; size exponent)
  sun_shade:
    enabled: true
    lma_shade_g_m2: 50.5
    lma_sun_increase_g_m2: 38.7
    lma_exponent: 3.3
    lma_reference_g_m2: 60.8
    size_lma_exponent: 1.0
  # Leaves stand off the node on a 1-2 cm petiole with a 3-7 cm blade, so a
  # bud's leaf area is spread over a Gaussian of this standard deviation (m)
  # around the node rather than piled into one voxel. VERIFY
  leaf_spread: 0.06
  # No shoot shades itself: the shade a shoot's own leaves (its axis with its
  # short shoots) cast on its buds is taken out of their light, for
  # photosynthesis, bud fate and leaf traits; their shade on every other
  # shoot stays.  false = only a bud's own leaves are taken out [P09].
  # Seed 1 at 60: carbon fixed +50 % open, +11 % stand.
  exclude_own_shoot: true
  # Shade is conserved going down apart from slow scattering (e-folding
  # length per metre of depth, m), so a closed canopy shades the crowns
  # below it as Beer-Lambert says.  It fades over shadow_horizontal_reach
  # (m) of sideways travel: low-angle shade from far away is broken up by
  # gaps, and this keeps the periodic wrap of the layer FFT off the crown.
  # The penumbra widens with variance penumbra_diffusion * path (m^2).
  # VERIFY
  shadow_decay_length: 30.0
  shadow_horizontal_reach: 6.0
  penumbra_diffusion: 0.11
  # Margin (m) that keeps the periodic wrap of the layer FFT off the crown.
  horizontal_margin: 8.0
  # Leaves that each bud state carries (shadow weight).  Current-year leaf at
  # every fresh node; birch short shoots bear 2-3 early leaves [CK66, M82];
  # older dormant buds are leafless.  Birch long shoots are heterophyllous:
  # 2-3 early (preformed) leaves at their base, then one late leaf per node
  # [CK66]; early_leaves is that base cluster, on the first node of each
  # season's shoot.
  foliage_weight:
    new_leaf: 1.0
    spur: 2.5
    dormant: 0.0
    early_leaves: 2.5
    # Neoformed late leaves on long shoots unfold sequentially over June-July
    # (Tenkanen et al. 2020, Tree Physiol. 40:198, DOI 10.1093/treephys/tpz124;
    # Miyazawa & Kikuzawa 2004, Tree Physiol. 24:631, DOI 10.1093/treephys/24.6.631),
    # photosynthesizing for a fraction of the full growing season.
    # VERIFY (for exact B. pendula cohort mean)
    late_leaf_season_fraction: 0.5
  # Perception volume for the optimal growth direction V [P09]: probe
  # distance (m), cone half-angle, number of probe directions, soft-min
  # width (shadow units). VERIFY
  perception_radius: 0.5
  perception_cone_deg: 80
  perception_samples: 64
  perception_softmin: 0.05
  # Woody shade attenuation.  Trunks and branches cast shade in addition to
  # foliage.  Extinction factor k_wood = 0.40 (Granier et al. 2000, DOI 10.1016/S0168-1923(99)00151-3;
  # Barclay et al. 2000, DOI 10.1016/S0168-1923(99)00091-X; Duursma & Mäkelä 2007,
  # DOI 10.1093/treephys/27.6.859; Chen et al. 1997, DOI 10.1029/97JD01107).
  # Enabled by default (physics, not a scenario setting).
  # VERIFY: in M1c no opened page gave 0.40 for wood, in any form (Granier and
  # Barclay not reached; Duursma and Chen abstracts only).
  woody_shade:
    enabled: true
    k_wood: 0.40

shedding:
  # A lateral branch is shed when the leaf-weighted mean light exposure of
  # its buds falls below this, or it has no leaves left.  This is the Q/N
  # test of [P09 Sec. 4, step 4] with the cost counted per leaf instead of
  # per internode: at real internode resolution the bare inner wood of
  # healthy limbs pushed Q/N to within 20% of any fixed threshold, so limbs
  # were shed in waves.  Branches die when their own foliage falls below
  # compensation (Sprugel, Hinckley & Schaap 1991).  Set to the light at
  # which short shoots die. VERIFY
  light_per_leaf_threshold: 0.21
  # Branches younger than this are never shed. VERIFY
  min_branch_age: 2
  # How a branch, a short shoot or a resting tip falls under its light or carbon line.  null (as it has been): all
  # of them, the first year.  Set: a chance a year, from 0 at the line to 1 at (1 - this) of it.  Without it a crown
  # whose neighbours are copies of it all crosses the line at once: leaf area 94 m2, then 11 m2 the next year (seed 4 at 50-51).
  shade_softness: null
  # A branch also dies when the carbon its own leaves fix (alpha x light x
  # stomatal opening, after the root share) no longer pays the upkeep of its
  # wood (maintenance_per_internode per internode; Sprugel, Hinckley &
  # Schaap 1991).  Death comes from light and carbon; ageing only lowers
  # vigour.  Seed 1 stand at 60: crown base 0.53 H (0.65 before), LAI 4.05
  # (2.95; measured 4.6 in Hagemeier & Leuschner 2019).
  carbon_balance: true

architecture:
  # Divergence angle on the vertical leader (spiral phyllotaxis). VERIFY
  phyllotaxis_orthotropic_deg: 137.5
  # Alternate, two-ranked buds on lateral shoots: Betula leaves are
  # alternate [A92]; distichous arrangement on plagiotropic shoots. VERIFY
  phyllotaxis_plagiotropic_deg: 180.0
  # Random scatter of distichous buds around the horizontal plane. VERIFY
  distichous_jitter_deg: 25
  # Insertion angle of a new lateral on its parent, by the new lateral's
  # order (1, 2, 3+).  First-order: the measured mean branch angle of silver
  # birch, 43.2 deg (range 15-80, SD 10.4; clonal plantation, Latvia,
  # Forests 9:52, 2018).  Higher orders VERIFY.
  branch_angle_deg: [43, 42, 48]
  # Long shoots of Betula are sympodial: the true terminal bud aborts and
  # the distal lateral bud continues the axis, deflecting it slightly each
  # year. VERIFY (angle)
  sympodial_deviation_deg: 8
  # The renewal shoot's deflection is a curvature over this first length of
  # the new shoot (m) instead of a kink at one node; fine twigs that add only
  # 2-3 internodes a year then bend gradually.  null = kink. VERIFY
  sympodial_bend_length_m: 0.1
  # Random perturbation of shoot direction per sqrt(metre) of growth (a
  # random walk, so independent of internode length). VERIFY
  direction_noise_per_sqrt_m: 0.126
  # Correlation length (m) of that noise along a shoot: the noise bends the
  # shoot as a smooth random curvature (same wander per metre) instead of
  # independent kinks at every internode, so twigs fall in arcs. null =
  # independent kinks. VERIFY
  direction_noise_correlation_m: 0.3

tropism:
  # Primary tropisms of elongating shoots: D' = D + xi*V + eta*T [P09 Sec.
  # 4.3], with xi and eta per metre of growth (multiplied by the internode
  # length each step) so they do not depend on resolution.
  # By branch order 0, 1, 2, 3+.
  # Phototropism xi (1/m). VERIFY
  phototropism_per_m: [0.8, 0.8, 1.2, 1.5]
  # Gravitropism eta (1/m): pull towards the set-point direction.  No
  # measured value for birch found.  Stem (and replacement leaders): 2/m, a
  # convergence length of ~0.5 m (defined by Bastien et al. 2013, PNAS
  # 110:755; no birch value).  Fitted on the natural plot against the 144
  # hand-traced birch stems (reference/stem_traces.json) on lean, max
  # off-line and total turning together, with the model's projected traces
  # clicked like the hand traces (clicks per trunk from the traces, scatter
  # 4.6 px = half the 0.5 %-of-height upper bound estimated from them): sum
  # of squared relative errors 0.81 / 0.14 / 0.20 / 0.41 at 1 / 2 / 3 / 4
  # per m (2 also best at 2.3 px; 4 at the 9.1 px upper bound).  At 4/m a
  # deflected leader was back on target within 0.25 m and the stem never
  # changed course (phase 16).  Height unchanged. VERIFY (fitted; other
  # orders unsourced)
  gravitropism_per_m: [2.0, 3.5, 2.0, 0.5]
  # The leader also turns towards the side of the crown that catches more
  # light (the light-weighted offset of the crown's leafy buds from the stem),
  # not only towards open sky at its apex, which is open in every direction
  # at the top of a stand.  Inside the crown the stem's posture target tilts
  # the same way, by phototropism over gravitropism (whole-tree phototropism,
  # Loehle 1986, Am. Midl. Nat. 116:190), so reaction wood straightens it
  # towards the light, not to vertical: seed 1 stand leans 1.2 deg (stand
  # photos 1-3 deg); with a vertical target 0.3 deg.
  stem_crown_phototropism: true
  # Gravitropic set-point angle from vertical (Digby & Firn 1995, Plant Cell
  # Environ. 18:1434), by order: the stem is vertical, birch main branches
  # ascend steeply [A92], higher orders spread.  Also the target of posture
  # control in the mechanics.  First-order limbs: the measured branch angle
  # (43 deg, as branch_angle_deg); the old 25 deg was chosen to hit a crown
  # width and kept limbs almost parallel to the stem (poplar-like).  Higher
  # orders VERIFY.
  setpoint_angle_deg: [0, 43, 45, 65]

mechanics:
  # Bending under load and posture control ([J00], [AF09]; mechanics.py).
  enabled: true
  # Fresh wood density (kg/m^3): silver-birch basic density ~0.5 g/cm^3 at
  # ~70-80 % moisture content. VERIFY: Tomczak et al. 2021 (doi 10.14214/sf.10545,
  # Table 3) measured green density 0.887-1.032 g/cm^3, moisture 62 %; ForestGALES
  # uses 900.
  wood_density: 850.0
  # Fresh mass of one leaf (kg): 12 cm^2 at ~70 g/m^2 dry mass and ~65 %
  # water. VERIFY
  leaf_mass: 0.0002
  # Bending stiffness of wood (Pa).  Small clear specimens of mature silver
  # birch: 14.5 GPa (Finnish data); green wood is lower. VERIFY
  youngs_modulus_wood: 1.0e+10
  # Stiffness of thin current-year shoots (Pa): mostly primary tissue; birch
  # shoots lose 2-2.5x stiffness when thawing (Russian shoot-bending study,
  # doi:10.1134/S1995425522070150). VERIFY
  youngs_modulus_shoot: 2.5e+9
  # Posture control: corrective curvature per year <= C * dr / r^2 [AF09],
  # C = 4 * (maturation-strain asymmetry of reaction wood, ~0.003). VERIFY
  reaction_wood_coefficient: 0.012
  # Posture control follows the sine law of gravitropism (Galland 2002,
  # Physiol. Plant. 115:481; Bastien et al. 2013, PNAS 110:755): the
  # correction scales with the sine of the deviation from the set-point.
  # false: full correction of any deviation, which kept every stem exactly
  # vertical.  The reaction-wood asymmetry saturates: full correction from
  # sine_law_saturation_deg on (a pure sine law left limbs sagging to 67 deg
  # from vertical against the measured 43). VERIFY (saturation angle)
  sine_law: true
  sine_law_saturation_deg: 10.0
  # The pendulous trait of silver birch [A92]: shoots thinner than this
  # radius (m) are soft and cannot correct their posture, so long thin
  # shoots hang under their own weight and the load they carry.  Stiffness
  # and correction are scaled by s(r) = (r/r_p)^p / (1 + (r/r_p)^p). VERIFY
  pendulous_radius: 0.006
  pendulous_sharpness: 4.0
  # Set: limbs (side axes on the stem) have this radius instead, so limbs ascend and only their thin ends arch over,
  # and the hanging is the twigs'.  null (as it has been): one radius for all.  TUNED, against nothing yet.
  pendulous_radius_limb: null
  # The year's load increment is applied in sub-steps on the updated shape;
  # no internode turns more than this per sub-step (rad). Model guard.
  substeps: 4
  max_rotation_per_step: 0.25

pipe_model:
  # VERIFY.  Diagnosis only (M3a), no source: see treegen/growth.py, _growth_factor.
  sapwood_for_next_season: false
  # r_parent^g = sum r_child^g [S64].  Measured exponents for trees lie
  # between ~2 and 3; the brief asked for ~2.5. VERIFY
  exponent: 2.5
  # Radius of a current-year long-shoot tip (m): birch twigs ~2 mm thick.
  # VERIFY
  tip_radius: 0.001
  # Pipe added by each short shoot (m). VERIFY
  spur_radius: 0.0008
  # How radii grow: "pipe" recomputes them each year from the pipes to the
  # current foliage (plus disused pipes of shed branches); "rings" adds an
  # annual ring to every living internode whose area follows the leaf area
  # beyond it, so the increment is constant below the crown base (Pressler's
  # rule) and wood of shed branches stays (disused pipes [S64]); wood is never
  # thinner than the pipes it carries (without that floor ring-grown limbs
  # were ~40 % thinner than the pipe model's and bent down under their load).
  # "stem_rings" grows only the stem by rings and keeps the pipe model for
  # branches.
  # "lignum" (phase 23): one carbon pool per year for new shoots and rings,
  # as in LIGNUM (Perttunen et al. 1996, Ann. Bot. 77:87): a single growth
  # factor scales every bud's shoot (its Borchert-Honda share) so that the
  # wood of the new shoots (tip_radius cross-section x length) plus the
  # sapwood rings the pipe model needs (hydraulics.huber_value of sapwood
  # per unit of foliage beyond, after sapwood senescence) equal the net
  # shoot carbon.  Before, shoots got the whole pool at one unit per
  # metamer and the rings the whole pool again.
  growth: lignum        # pipe | stem_rings | rings | lignum
  # Share of the conducting wood that stops conducting each year and must
  # be replaced by a new ring outside; the old wood stays in the stem
  # (birch has no visible heartwood, but its inner rings lose
  # conductivity).  1 / (rings that conduct): in mature diffuse-porous
  # broadleaves the dyed hydro-active xylem spans the outer 40-88 rings
  # (median 72; beech, hornbeam, lime, sycamore, field maple whose
  # sapwood is younger than the tree; Gebauer, Horna & Leuschner 2008,
  # Tree Physiol. 28:1821, Table 1), so 0.014 (0.011-0.025).  No birch
  # count found: VERIFY (birch).  LIGNUM's Scots pine value is 0.07.
  sapwood_senescence_per_year: 0.014
  # TUNED, against nothing yet: the same for side axes alone.  null (as it has been): one figure for the whole tree.
  branch_sapwood_senescence: null
  # true: the requirement is on the conducting wood, with
  # sapwood_senescence_per_year; false: on the whole wood, no turnover.
  sapwood: true
  # Crown-rise heartwood retirement (Mäkelä 1997, Sievänen et al. 1997):
  # for internodes below the live crown base, pipe requirement only serves
  # the active crown above (A_su); any old sapwood exceeding A_su is
  # converted to heartwood, eliminating the need to lay down replacement
  # rings for retired crown layers.
  crown_rise_heartwood: false
  # true: below the crown base each internode keeps the sapwood its own foliage beyond needs.  false (as it has
  # been): all of them keep the crown base's figure, on one side of a fork, so on a forked stem the other side
  # loses sapwood every year and rebuilds it.
  heartwood_by_own_foliage: false
  # Count the rings that keep this season's foliage supplied (replacing
  # sapwood that stopped conducting, plus the foliage added) as upkeep in
  # the natural-mode death test, like rebuilding the leaves.  In the pipe
  # model's carbon balance the growth that replaces senescent sapwood comes
  # before foliage, and a tree whose production cannot cover it loses
  # foliage and dies: "the model hence explains the mortality of suppressed
  # trees" (Makela 1986, J. Theor. Biol. 123:103; IIASA WP-85-89).  Here the
  # cost enters the existing two-year deficit test instead of shrinking the
  # foliage first.  Off: only maintenance and leaf and fine-root costs.
  sapwood_replacement_is_upkeep: false
  # Conducting wood per unit of foliage beyond rises from the twigs to the
  # stem: hydraulics.huber_value at a current-year shoot (tip_radius),
  # times (r / tip_radius)^b.  b is fitted so that the whole cross-section
  # (conducting plus old wood) per unit of leaf area at breast height
  # matches young and older silver birch together, with equal weight:
  # Konopka et al. 2023 (Plants 12:1607; leaf area 2.37 m2 (D0/50 mm)^1.851,
  # DBH = -6.627 + 0.611 D0 mm; D0 50-100 mm) and Repola 2008 (Silva
  # Fennica 42:605, foliage Eq. 12, DBH 11-26 cm, SLA 15 m2/kg [Uri et al.
  # 2007]).  The old wood depends on each tree's history, so the fit grows
  # the seed-1 stand tree for each b (tools/fit_huber_exponent.py): b =
  # 0.312 (not used while huber_path_exponent is set).  It leaves the
  # young trees with 1.4-2.5x Konopka's leaf area
  # for their DBH and DBH 20-26 cm with 0.6-0.7x Repola's.  Marklund 1988
  # has no birch foliage function.
  huber_radius_exponent: 0.312
  # Not in use at the default stem_theory stage 2, which sets c to 0.  Used
  # only at stage 0 (phase 30): the Huber value rises from tip to base with the
  # leaf-weighted path length l from each internode to the leaves it
  # supplies, huber_value x (l / l_ref)^c, instead of with its radius.
  # VERIFY: the pattern has no stem-level source.  This comment used to credit
  # Mencuccini et al. 2019, New Phytol. 224:1544; that paper says the opposite,
  # "Hv tend to remain relatively constant from twig to trunk base" (accepted
  # manuscript p. 19; corrected in M1c).  The only birch support found is within
  # the crown: "HV increased basipetally within a crown" (Sellin & Kupper 2006,
  # Trees 20:311, abstract).  l_ref: the leaves of the current-year
  # shoots huber_value was measured on sit on average half their 27.9 cm
  # beyond the shoot base [OP22].  c = 0.283 is fitted to Konopka et al.
  # 2023 and Repola 2008 Eq. 12 together, at breast height over bark
  # (tools/fit_huber_exponent.py --path), as b was.  With c set,
  # huber_radius_exponent is not used.
  huber_path_exponent: 0.283
  huber_path_reference_m: 0.14
  # Wood volume per model carbon unit (m3): the size of the unit (with the
  # basic density in leaf_costs, 0.64 g dry matter).  In lignum growth it
  # only converts wood to carbon.  The model's carbon has no
  # published conversion; set when the carbon budget was smaller (open seed 1
  # keeping its pipe-model DBH); with the phase-7 budget it gives stand seed
  # 1 H/D 88 and DBH 30.6 cm at 60. VERIFY (calibrated)
  wood_volume_per_carbon: 1.2e-6
  # Stress floor (rings only): each year's ring is at least what keeps the
  # self-weight bending stress (wood and leaves beyond, about the internode's
  # base) at or below a safe limit, the uniform-stress hypothesis (Metzger
  # 1893; McMahon & Kronauer 1976).  Limit = green modulus of rupture /
  # safety factor.  Silver-birch MOR 114 MPa on small clear specimens
  # (Wood Sci. Technol. 37, doi 10.1007/s00226-003-0209-1; seasoned); green
  # wood about half of that (yellow birch 57 vs 114 MPa green vs 12 %
  # moisture, USDA Wood Handbook) -> 57 MPa. VERIFY (green value derived).
  # Branch breaking safety factor (MOR / actual bending stress, all loads)
  # above 3.5 and about constant along branches (Univ. Tokyo study,
  # repository.dl.itc.u-tokyo.ac.jp record 7675). VERIFY (other species).
  # The extra wood is not charged to the carbon budget.
  stress_floor:
    enabled: true
    wood_mor_green_mpa: 57.0
    safety_factor: 3.5
  # Wind load (phase 31): in lignum mode each year's ring is the larger of
  # the conducting sapwood need and what keeps the peak wind bending stress
  # sigma = M / (pi r^3 / 4) at or below a safe fraction of green wood
  # strength, paid from the same shoot carbon budget.  Crown wind drag from
  # the ForestGALES roughness method (Gardiner et al. 1997, Forestry 70:233,
  # DOI 10.1093/forestry/70.3.233; Gardiner et al. 2000, Ecol. Model. 129:1,
  # DOI 10.1016/S0304-3800(00)00220-9; Hale et al. 2015, Environ. Model.
  # Softw. 68:27, DOI 10.1016/j.envsoft.2015.01.016; Locatelli et al. 2017,
  # Environ. Model. Softw. 87:84, DOI 10.1016/j.envsoft.2016.10.010) with
  # Raupach's (1994, Boundary-Layer Meteorol. 71:211, DOI 10.1007/BF00709229)
  # canopy drag partition and zero-plane displacement, distributed over the
  # crown's leaf area by height so the stem is sized all the way to the top
  # (Metzger 1893; Morgan & Cannell 1994, Tree Physiol. 14:49, DOI
  # 10.1093/treephys/14.1.49).
  # ForestGALES silver birch (BI) parameters: green MOR 63.0 MPa, knot
  # factor 1.0 (Lavers 1969, For. Prod. Res. Lab. Bull. 50; Hale et al.
  # 2015), crown streamlining C = 1.9627 and N = 0.881 clamped to 10-20 m/s
  # (Mayhead 1973, Agric. Meteorol. 12:123, DOI 10.1016/0002-1571(73)90013-7;
  # Vollsinger et al. 2005, Can. J. For. Res. 35:1238, DOI 10.1139/x05-051),
  # air density 1.22 kg m-3, deflection loading factor 1.136 (credited to Hale et
  # al. 2015 in the fgr vignette Deflection_Loading_Factor; Hale itself not read;
  # this comment used to credit Gardiner et al. 2000).  These are ForestGALES
  # (fgr) model values.
  # Target stress = wood_mor_green_mpa * knot_factor / safety_factor.
  # safety_factor 3.5 -> 18.0 MPa (from Univ. Tokyo branch study above; note
  # Niklas & Spatz 2000, Trees 14:230, DOI 10.1007/s004680050008 argue against
  # a constant stress or constant safety factor across tree sizes). VERIFY
  # Wind speed (m s-1): Morgan & Cannell (1994, DOI 10.1093/treephys/14.1.49)
  # find uniform-stress taper holds for average canopy-top winds of 2.5-10.0
  # m s-1 (standard 5.0 m s-1) and breaks down at >= 15 m s-1; Bonnesoeur et
  # al. (2016, New Phytol. 210:850, DOI 10.1111/nph.13836) show radial
  # acclimation responds to intense storms rather than daily breezes (no speed
  # in m s-1 given); 25.0 is the 50-year 10-min reference wind for Goteborg /
  # Swedish west coast (Boverket EKS / SS-EN 1991-1-4 national annex; VERIFY
  # for Lysekil). VERIFY
  wind_load:
    enabled: false
    wind_speed_m_s: 25.0
    wood_mor_green_mpa: 63.0
    knot_factor: 1.0
    safety_factor: 3.5
    air_density_kg_m3: 1.22
    streamlining_c: 1.9627
    streamlining_n: 0.881
    streamlining_min_wind_m_s: 10.0
    streamlining_max_wind_m_s: 20.0
    deflection_loading_factor: 1.136
  # Stem theory (phase 37), off by default (stage 0).
  # stage 1 ("a"): plain pipe model - huber_path_exponent and
  # huber_radius_exponent are not used (c = 0); below the live crown base the
  # conducting sapwood is that of the crown base, A_s(z) = A_s(H_c)
  # (Shinozaki et al. 1964, Jpn. J. Ecol. 14:97; Makela 1997, For. Sci.
  # 43:7, DOI 10.1093/forestscience/43.1.7), and sapwood above that is
  # retired to heartwood (as crown_rise_heartwood).  No wind.
  # stage 2 ("b"): stage 1 plus the wind envelope (wind_load above, with its
  # strength parameters: target stress = wood_mor_green_mpa x knot_factor /
  # safety_factor = 18 MPa, VERIFY as noted there) at wind_speed_m_s at the
  # canopy top.  12 m/s was set in the phase-37 brief, not fitted: VERIFY.
  # Below a taller canopy top (plot mode: the tallest living tree) the wind
  # at the tree's own height follows the exponential within-canopy profile
  # u(z) = u_h exp(a (z / h_c - 1)) (Inoue 1963, J. Meteorol. Soc. Jpn.
  # 41:317).  a = 2.0 is a typical leaf-on broadleaf value from secondary
  # summaries, not checked in a primary table: VERIFY.  A single stand tree
  # is the canopy (its neighbours are copies of it), so the profile does not
  # change it.
  stem_theory:
    stage: 2
    wind_speed_m_s: 12.0
    canopy_wind_attenuation: 2.0

geometry:
  # Root flare.  "buttress": the stem base rises in ridges over the main
  # structural roots (mesh._buttresses): each ridge as wide and as high at the
  # ground line as its root is thick, fading upwards; the largest reaches the
  # uppermost root collar, whose height for birch is 0.4862 DBH[cm] +
  # 0.4979 H[m] cm (Laasasenaho 1982, Commun. Inst. For. Fenn. 108, as coded
  # in the forester R package; relative SE 44 %).  Ridge width and height
  # in proportion to root size are geometric assumptions. VERIFY
  # "bell" (also the fallback for meshes without roots): a uniform swelling,
  # radius gain at ground level and its decay height (m). VERIFY
  root_flare_mode: buttress
  root_collar_height_coef: [0.4862, 0.4979]
  root_flare_extra: 0.35
  root_flare_height: 0.45
  # Junction fillet radius as a fraction of the child radius. VERIFY
  junction_blend: 0.6
  # Branch collar: extra radius of a lateral where it leaves its parent and
  # the decay length of that swelling in child radii. VERIFY
  collar_extra: 0.35
  collar_length: 1.5

reference:
  # Used only by the stats checks, never by the growth model.
  height:
    # Hossfeld IV site-index model [E97]: H50 at breast-height age 50 (m).
    # 20-26 m spans medium to good Swedish birch sites; planted birch on
    # former farmland averages ~28 m (Karlsson et al. 1997).
    site_index_low: 20
    site_index_high: 26
    asi: 7
    beta: 394
    b2: 1.387
    # Years from germination to 1.3 m on a good site. VERIFY.  Used only by
    # the height check in stats.json.  The scorecard's band now uses Elfving
    # 2010 p. 56 instead (T13 = 150/SIS; reference/targets.yaml).
    years_to_breast_height: 4
  crown:
    # Linear fit to the open-grown silver birch table of [H05]:
    # crown diameter (m) = 0.96 + 16.2 * dbh (m).
    intercept_m: 0.96
    slope_m_per_m: 16.2
  dbh:
    # Open-grown / crown-released silver birch reaches 40-50 cm in 60 years
    # (target trees, Forests 12(5):599, 2021); stand-grown trees at rotation
    # (50-60 yr) are ~25-30 cm [H10].  VERIFY
    open_grown_band_cm: [30, 50]
    band_age: 60

leader_damage:
  # Loss of the leader's last annual shoot.  Each season the highest leader
  # tip is tested against every event whose height range holds it; a hit
  # kills that shoot, and the uppermost replacement_leaders lateral buds or
  # young laterals within replacement_zone_m below the wound become
  # leaders (upright set-point and posture, the stem's vigour).
  #   Moose browsing: recent damage (apical leader browsed or trunk broken)
  #   on 16.8 +- 1.9 % of birch stems in one winter, young stands of mean
  #   height 1-4 m in southern Sweden at 0.6-0.9 moose per km2 (Bergqvist,
  #   Bergstrom & Wallgren 2014, Silva Fennica 48:1077).  Moose reach about
  #   3 m. VERIFY (reach).
  #   Late frost, snow and wind breakage of the top: no published yearly
  #   rates for birch found; not included.
  # On by default (Swedish young stands are browsed); stand seed 1-20 at 22
  # years: 20 % forked, 45 % crooked stems (published: 39-42 % with a stem
  # defect at 22, Viherae-Aarnio & Velling 2008, Silva Fennica 42(5)).
  enabled: true
  replacement_leaders: 2
  replacement_zone_m: 0.5
  # Moose winter bite diameter: mean 2.16 +- 0.15 mm measured on juvenile
  # Betula pubescens twigs at 0.5-3 m browsing height in Norway (Mathisen,
  # Milner & Skarpe 2017, BMC Ecology 17:12, DOI 10.1186/s12898-017-0122-3),
  # removing the distal ~10-35 cm. VERIFY (measured on B. pubescens; extrapolated
  # to B. pendula apical leaders).
  bite_diameter_m: 0.0022
  events:
    - name: moose browsing
      min_height_m: 0.3
      max_height_m: 3.0
      probability_per_year: 0.168

damage:
  # Old age, wind and snow (treegen/damage.py).  Off by default.  Labels and
  # sources for every value: reference/betula_pendula/labels.yaml.
  enabled: false
  # Over-bark DBH per wood DBH, from Hansen et al. 2023 as in tools/bark.py
  # (the small intercept dropped); the wind data are over bark.
  dbh_over_bark_factor: 1.098
  # Stem volume / (pi/4 DBH^2 H): 0.45 at both sites of Krisans et al. 2022,
  # Tables 1-2 (site means).
  stem_form_factor: 0.45
  old_age:
    enabled: false
    # Elfving 2010 p. 67 Table 3 and Eq. F1, birch, from 4,040 Swedish sample
    # trees (both birches, oldest 240 rings at breast height):
    # ln AMAX = b0 + b1 SIS + b2 ln n, read at n = 10,000 as the report does.
    amax_b0: 4.6246
    amax_b1: -0.02192
    amax_b2: 0.1742
    amax_n: 10000
    # Site index on the top-height-at-100 scale.  SI 20 and SI 26 of the height
    # target are 25.08 and 29.93 m on it (targets.yaml); this is about SI 23.
    site_index_sis_m: 27.5
    # Elfving p. 68, p = 1 / (1 + exp(a - b A / AMAX)) (from MELA, Hynynen 2002).
    ageing_a: 10.0
    ageing_b: 12.0
    # A counts rings at breast height.  T13 = 150 / SIS (Elfving p. 56).
    years_to_breast_height: 5.5
  wind:
    enabled: false
    # Kitenberga et al. 2021 Table 1: logit of being snapped or uprooted within
    # a 5-year period, 14,749 birches (both species) in Latvia; per SD about the
    # mean (Table 2), which her Figs. 1 and 2 confirm.  At dry mineral soil, no
    # prior damage.  Other soils: peat 0.75, drained peat 0.94, drained mineral
    # 0.32, wet mineral 0.00.
    intercept: -5.03
    site_effect: 0.0
    prior_damage: 1.46
    period_years: 5
    # TUNED against her 2.9 % and 3.4 % of all birches damaged in a period: her
    # fixed effects give about 0.9 % on the mean tree and soil mix, because the
    # plot's and tree's random effects carry the rest.  logit(3.15 %) - logit(0.94 %).
    population_offset: 1.23
    # TUNED, no target: a storm year in five, all the period's damage in it, so
    # trees go in groups in the same direction instead of one by one.
    storm_return_years: 5
    # TUNED, no target, looks only: where storms come from, and the scatter.
    wind_from_deg: 240.0
    wind_from_sd_deg: 40.0
    # Her data: trees of DBH 14 cm and over.
    min_dbh_cm: 14.0
    age:
      per_sd: 0.39
      mean: 57.35
      sd: 21.35
      range: [11.0, 216.0]
    stems_per_ha:
      per_sd: -0.70
      mean: 1128.0
      sd: 890.0
      range: [100.0, 11520.0]
    basal_area_m2_ha:
      per_sd: 0.21
      mean: 27.5
      sd: 10.05
      range: [3.0, 67.0]
    # Height (m) over DBH (cm, over bark).
    slenderness:
      per_sd: 0.39
      mean: 1.0
      sd: 0.2
      range: [0.3, 1.9]
  failure:
    # Stem strength under short loads: 70 % of clear-wood MOR, 44 MPa for birch
    # (Nykanen et al. 1997 p. 198, from Peltola et al. 1997).
    mor_green_mpa: 44.0
    # TUNED against 31-35 % of damaged birches uprooted (Kitenberga p. 6): the
    # log of (critical turning moment / stem breaking moment) at which a failing
    # tree is as likely to uproot as to snap, and the width of that choice.  Her
    # mean tree (17.6 m, 17.6 cm over bark, so 16 cm of wood) has a ratio of 0.90,
    # and this gives it 33 %.
    even_odds_log_ratio: -0.46
    spread: 0.5
  snap:
    # Relative height of the break = intercept + slenderness x H/D + prior
    # damage (Kitenberga Table 3; mean 0.43 on her mean tree).
    intercept: 0.532
    slenderness: -0.097
    prior_damage: -0.090
    # Spread of a beta distribution, read from her Fig. 4 (SD 24 % of height).
    beta_concentration: 3.2
  snow:
    enabled: false
    # Years between damaging snowfalls: every 5 in southern Finland, 3 in the
    # north-east, 8-17 elsewhere (Solantie 1994, in Nykanen p. 201).
    return_years: 5
    # Wet snow on the crown, kg/m2 of crown area: 20-40 with little wind raises
    # breakage (Zubizarreta-Gerendiain et al. 2012 p. 192), 60 mm of water is
    # severe (Solantie, in Nykanen Fig. 1).  Evenly spread within that, a choice.
    load_range_kg_m2: [20.0, 60.0]
    # TUNED against three things together, on the saved plots' trees (base_plots):
    # a 12 m birch of taper 1:120 stands 60 kg/m2 (Nykanen Fig. 2, Peltola 1997);
    # one severe event breaks or uproots about 2 % of a young stand (Donis et al.
    # 2024, in KNOWN_ISSUES; here 1-4 % at ages 8-15) and bends about 29 % (here
    # 18-39 %).  Share of the crown's projected area that holds the load, the
    # stem's lean under it as a share of height, the width of the break, and the
    # stems that bend instead: buckling factor under this, DBH under this.  Stems
    # under min_break_dbh_cm only bend.
    crown_catch_fraction: 0.10
    lever_fraction: 0.02
    spread: 0.5
    bend_buckling_factor: 6.0
    bend_max_dbh_cm: 10.0
    min_break_dbh_cm: 2.0
  uproot:
    # TUNED, no target, looks only: mound radius per plate radius, the mound's
    # distance past the hinge per plate radius, and how fast the relief fades.
    mound_radius_factor: 1.0
    mound_distance_factor: 1.0
    relief_half_life_years: 20.0

plot:
  # A plot of independent trees (treegen/plot.py, tools/plot.py).  Trees
  # differ by seed, by germination year (natural regeneration on a clear
  # felling establishes over a few years; VERIFY) and by a heritable factor
  # on their carbon gain, lognormal with this SD (additive genetic CV of
  # growth in silver birch progeny trials is roughly 5-10 %; VERIFY).
  germination_years: [0, 1, 2, 3]
  germination_weights: [0.4, 0.3, 0.2, 0.1]
  vigour_sd: 0.06
  # Output only, off by default: basal area over bark, top height, gap fraction
  # and new trees in the plot's yearly stats (tools/stand_table.py).  A gap: no
  # leaf above gap_above_m over a ground cell of gap_cell_m (Brokaw's hole in the
  # canopy down to 2 m; the cell is my choice, about a crown's half-width).
  stand_measures: false
  gap_cell_m: 2.0
  gap_above_m: 2.0
  # A natural start (tools/forest.py), off by default: this density from the
  # first years, not the 1800/ha of the thinning programme.  Aosaar et al. 2016
  # Table 3: 11,633 stems/ha at age 8 on an unmanaged stand on abandoned farmland.
  # TUNED (stems_per_ha): against that 11,633 at age 8, with the mortality block on
  # and alpha 3.0 standing in for slower young growth (one 400 m2 plot: 10,150 at 8,
  # 8,575 at 10 against 10,200).  At today's alpha 4.8 young trees outrun it: about
  # 3,800 at 8, whatever the start.  Real starts go far denser (Dahlgren Lidman et
  # al. 2024 Table 2: 9-18 seedlings per m2 at year 3 on scarified mesic soil).
  # side_x_m, side_y_m: a rectangle of ground instead of area_m2 (a strip of
  # forest edge); patch_x_m: only the first metres of x hold trees at the start.
  natural_start:
    enabled: false
    stems_per_ha: 16000
    area_m2: 1000
    side_x_m: null
    side_y_m: null
    patch_x_m: null

regeneration:
  # Natural regeneration in a plot (treegen/regeneration.py; tools/plot.py
  # --regeneration).  Seeds shed in a year by a tree of 20 cm DBH: ~137,000
  # (Wytham Woods, UK, 2015, inverse modelling of seed traps) [Liu & Evans
  # 2021, Forests 12:929].  Seed crops vary several-fold between years [same;
  # Dahlgren Lidman et al. 2023]; a constant crop here.
  seeds_ref: 137000
  dbh_ref_m: 0.20
  # Seed output in proportion to basal area (DBH^2). VERIFY
  fecundity_exponent: 2.0
  # Age from which a tree sheds seed.  Grafts and seedlings in Finnish seed
  # orchards flower from 2-3 years; no figure found for stand-grown trees.
  # VERIFY
  maturity_years: 10
  # Mean dispersal distance 38 m in a closed stand (65 m in the open) [Liu &
  # Evans 2021]; a 2-D exponential kernel. VERIFY (kernel shape)
  dispersal_mean_m: 38.0
  # One-year silver-birch seedlings per seed sown, unfenced, in full light on
  # clear fellings in central and northern Sweden, September one year after
  # sowing [Dahlgren Lidman et al. 2023, New Forests 55:157, Table 5]: on bare
  # mineral soil median 18 % (0-179 %, 12 site-years on mesic and moist
  # sites); on undisturbed humus on mesic sites 0.3 % (mean of 6 site-years:
  # 0, 0, 0, 0, 0, 2 %).  They include germination and the first year's
  # losses (drought, seed predation, browsing).
  establishment_mineral: 0.18
  establishment_organic: 0.003
  # Ground grid cell (m); at most one recruit per cell and year: more than one
  # seedling per m2 adds little because birch seedlings outcompete each other
  # within a few years [Dahlgren Lidman et al. 2023].
  cell_m: 1.0
  # Exposed mineral soil: share of the ground at the start (the stand grows up
  # after a stand-replacing disturbance), share newly exposed each year
  # (uprooting, animals, frost heave) and half-life of its cover.  Pit-mound
  # microrelief from uprooting covers 7-12 % of the ground in all-aged boreal
  # forests [Samonil et al. 2010, Geoderma 157:65, review].  The cover comes
  # back with the field layer's recovery half-life (environment
  # ground_vegetation.recovery_half_life_years); this half-life is used only
  # when the environment gives none.  VERIFY (all three)
  mineral_initial: 0.3
  mineral_new_per_year: 0.005
  mineral_half_life_years: 5.0
  # A forest that spreads over open ground (treegen/regeneration.py,
  # SpreadRegeneration), off by default.
  spread:
    enabled: false
    # Liu & Evans 2021, Forests 12:929 (publisher's PDF), best model, Table 1 and
    # Eqs 2, 5, 6: a lognormal kernel, mean distance exp(u0 + ut T) and shape
    # exp(p0 + pt T), T the trees of DBH over 15 cm in the source's 10 m cell; 65 m
    # in the open, 38 m at 3 trees a cell; both birches, Wytham Woods, one year
    # (2015).  Their Eq. 2 prints "- p^2/2" after ln u, which would make the mean
    # 1.19 u; their text calls u the mean, and that is what's used. VERIFY (sign)
    ln_mean_m: 4.18
    ln_mean_per_tree: -0.18
    ln_shape: -0.86
    ln_shape_per_tree: -0.04
    density_cell_m: 10.0
    tree_dbh_cm: 15.0
    # Their Figure 2 stops at 5 trees a cell (0.05 trees/m2); no further here.
    max_trees_counted: 5
    # Seed past the two ends of x is lost, and the sides repeat; true: x repeats too,
    # for a plot in the middle of a forest.
    repeat_ends: false
    # How far the kernel's table runs; 6 mean distances at the open-ground mean.
    kernel_reach_m: 400.0
    # TUNED: the share of germinants living through the first season rises from 0
    # at the first light to 1 at the second (relative, at 0.1 m, canopy only: the
    # organic layer's rate already holds its field layer's shade).  The first is set
    # above the 25-29 % where no recruit lived past six years (KNOWN_ISSUES phase 27)
    # and 234 recruits here, none alive at 10 years; the second so that gaps and open
    # ground take in full.  Silver birch is a light-demanding pioneer; I found no
    # opened figure for its first-year light need.
    establishment_light: [0.30, 0.60]
    # TUNED: and none takes where more than this share of the ground within about
    # this radius (a Gaussian's SD, a crown's width) has a leaf above 2 m over it.
    # Tuned against one plot's windthrow: the light field's contrast is too low to
    # tell a gap from a canopy (10th-90th percentile 0.42-0.52), and real closed
    # canopies, at 6.4-19.8 % light, stop seedlings through light alone.
    canopy_cover_max: 0.5
    canopy_radius_m: 3.0
    # Share of a windthrow gap's ground bared by uprooting (Plot.open_gap).  Pit-mound
    # microrelief covers 7-12 % of the ground in all-aged boreal forests [Samonil et
    # al. 2010, as above]; the top of that, for a fresh gap. VERIFY
    windthrow_mineral: 0.12
    # TUNED (memory, not biology): at most one recruit per cell a year, so this
    # sets the densest a young stand can be: 2 m is 2500 stems/ha.  The plain class
    # has 1 m.  Set lower where the machine allows.
    cell_m: 2.0
    # A limit on memory, not a model value: null is no limit.
    max_recruits_per_year: null

mortality:
  # Mortality that answers to crowding and to a tree's vigour, in natural plots
  # (treegen/thinning.py), off by default.  On top of the carbon rule, which
  # leaves a suppressed tree alive for decades on a metre of leaf.
  enabled: false
  # --- Self-thinning: RD = SDI / sdi_max, SDI = sum of (DBH over bark / 25 cm) ^
  # slope a hectare (Reineke's stand density index, summed tree by tree).
  # TUNED (slope): Reineke's -1.605 as cited; Hynynen 1993's birch line is
  # paywalled and not opened, and the project catalogue's -1.6 for it is unverified.
  self_thinning_slope: 1.6
  # TUNED (sdi_max): the highest SDI in Aosaar et al. 2016 Table 3 (age 14, 6567
  # stems/ha, 21.3 m2/ha).  It's one fertile 0.03 ha plot.  Checks, not fits:
  # Hagemeier & Leuschner's two stands sit at RD 0.82 and 0.57 under it; on it,
  # basal area is 33.5 m2/ha at Dg 20 cm and 36.7 at 25, near Repola 2008's top of
  # 32.3 and Soderberg 1986's limit for broadleaves of 33 at age 60 (Elfving 2010,
  # Appendix 11, at SI 26, N 600-1000).
  sdi_max: 747.0
  # TUNED (onset, rate_at_max, shape): stems lost per stem and year = rate_at_max *
  # ((RD - onset) / (1 - onset)) ^ shape.  Picked from a grid of least-squares fits
  # to Aosaar Table 3's nine yearly losses at its own RD; the data don't pin the
  # onset (rmse 0.094-0.098 a year for 0.55-0.70).  Given Table 3's RD this takes
  # 11,633 stems/ha at 8 to 2,731 at 17 (Table 3: 2,733).  Long's 1985 rule of thumb,
  # not opened, puts the onset of competition mortality near 0.6 too.  The fit is to
  # a stand at 3-10 cm DBH; no source tests it for old stands.
  onset: 0.60
  rate_at_max: 0.278
  shape: 1.5
  # TUNED: the most a neighbourhood loses in a year, at RD far over 1.  Aosaar's
  # worst year lost 35.5 % of stems, hazard 0.44.
  rate_cap: 0.5
  # TUNED: crowding is read over a Gaussian neighbourhood of this SD, a crown or
  # two away.  Small enough for a gap and a thicket to differ.
  neighbourhood_sigma_m: 5.0
  grid_m: 1.0
  # Over-bark DBH from the model's wood DBH, as tools/bark.py: Hansen et al. 2023
  # double bark thickness (mm) = b0 + b1 DBH + b2 d, as coded in taperNOR 0.2.1.
  bark_double_mm: [-0.48552367, 0.04957885, 0.84676248]
  # Who goes: Fridman & Stahl 2001, birch, 5-year probability against DBH over
  # bark, digitised from Elfving 2010 p. 65 (the knowledge base, 05-F), used as
  # Heureka does, to share out a stand's mortality.  Below 10 cm it's extrapolated
  # (no trees under 10 cm in their data); beyond the table, a line in ln p.
  size_weight:
    dbh_cm: [5, 10, 15, 20, 25, 30]
    p5: [0.33, 0.21, 0.14, 0.09, 0.06, 0.04]
  vigour:
    # Vigour: mean ring width over these years (wood DBH); low-growth mortality is
    # the common form (e.g. Pacala et al. 1996, Bigler & Bugmann 2003; neither
    # opened and neither birch).  Weight = floor + (1 - floor) exp(-ring / scale).
    # TUNED (all four): against the base plots' trees that stand still for decades.
    window_years: 5
    ring_scale_mm: 0.5
    floor: 0.02
    # A tree laying no wood dies at this hazard a year wherever it stands.
    suppressed_hazard: 0.10
  # Bengtsson 1978's deciduous function for southern Sweden, % of volume a year, as
  # printed in Elfving 2010 p. 64; D 7-30 cm, age 30-120, the closest limit beyond;
  # "reduced with ... 25 % in southern Sweden".  Applied to stems (no volume here).
  background:
    intercept: 0.46
    per_d: -0.02
    per_age: 0.0046
    reduced_to: 0.75
    d_range_cm: [7.0, 30.0]
    age_range_years: [30.0, 120.0]
  # Elfving 2010 pp. 67-68: p = 1 / (1 + exp(10 - 12 A / Amax)), a year; ln Amax =
  # 4.6246 - 0.02192 SIS + 0.1742 ln n at n = 10,000, birch, SIS 26: 287 years.
  old_age:
    max_age_years: 287.0

stand:
  # --stand: neighbour trees as shadow volumes.  The light grid is one
  # periodic cell of a hexagonal stand lattice; every lattice point is a copy
  # of the focal crown turned by a fixed random angle, and the grid repeats,
  # so the focal tree is surrounded by neighbours in every direction with no
  # stand edge.  Trees across one cell (4 = 16 trees, two rings before the
  # pattern repeats).
  cell_trees: 4
  # In a closed stand nothing breaks up low-angle shade, so it does not fade
  # sideways (m).
  shadow_horizontal_reach: 1000.0
  # Nor does it fade on the way down below the canopy (the open-tree e-folding
  # length of 30 m let light recover towards the ground, and limbs from the
  # seedling years lived on at 0.2-1.5 m in a 60-year-old stand). null = as
  # light.shadow_decay_length.
  shadow_decay_length: 1000.0
  # Neighbour layout.  "lattice": the hexagonal lattice, every point a copy of
  # the focal crown turned by a random angle (symmetric light, dead straight
  # stems).  "random": cell_trees^2 trees at random positions in a square
  # periodic cell at the same stem density, no two closer than min_distance x
  # the mean spacing (thinned stands are more regular than random), each a
  # copy turned by a random angle and scaled by a fixed relative size (height
  # CV of even-aged stands about 0.1; VERIFY).
  layout: random
  min_distance: 0.6
  size_cv: 0.10
  # Stem density by top height, Swedish silver-birch practice [SS14]:
  # after pre-commercial thinning no more than 1500-2000 birches/ha by 6-7 m
  # height (p. 69-70); first thinning at 10-12 m top height to 800-1200/ha
  # (p. 88); next at 15-17 m, either one strong thinning to 400-500/ha or
  # 600-800/ha and a last one at ~20 m to just under 400/ha (p. 88).  The
  # dominant schemes are 2-3 strong, early thinnings ending at 300-400/ha
  # (p. 87; Hynynen et al. 2010: two thinnings, 389/ha).  Here: the strong
  # two-thinning programme, mid-range values.  The green crown is to stay
  # above 50 % of tree height (p. 87).  The neighbours are copies of the
  # focal crown, so they follow its height curve every year.
  thinning:
    - {from_height_m: 0.0, stems_per_ha: 1800}
    - {from_height_m: 11.0, stems_per_ha: 1000}
    - {from_height_m: 16.0, stems_per_ha: 450}

stats:
  # A first-order limb counts towards the crown base only if its subtree
  # carries at least this share of the tree's leaves.
  crown_base_min_leaf_share: 0.005
  # true: a limb is a side axis on the stem or on a leader that replaced it.  false (as it has been): order == 1,
  # which counts a replacement leader as a limb attached low, and doesn't count the limbs on it.
  limbs_on_leader: false
  # Hanging runs shorter than this (m) are not counted as hanging twigs.
  hanging_twig_min_length: 0.2

hydraulics:
  # Pipe-model water transport (hydraulics.py) [S64, K04].
  # Transpiration of a fully lit leaf at midday (kg m^-2 s^-1).  Branch sap
  # flow in the upper crown of silver birch averages 59 g m^-2 h^-1 in daytime
  # (1.6e-5; Sellin & Lubenets 2010, doi 10.1002/eco.133, abstract; this comment
  # used to cite PMC4602113, which doesn't have it); midday about twice that was
  # not seen in a source.
  # VERIFY
  transpiration_max: 3.0e-5
  # Xylem-specific conductivity of stem and branch wood (kg m^-1 s^-1
  # MPa^-1).  Diffuse-porous broadleaves 1-5; birch has the highest whole-
  # plant and shoot conductance among temperate saplings compared.  At 2.0
  # the top leaves of a well-watered tree reached -2.0 MPa, at the branch
  # P50 (-1.8 to -2.0 MPa [K18]; PMC6025199) and where birch only goes in
  # severe drought (-1.9 to -2.1 MPa; well-watered -1.0 to -1.3, Sellin et
  # al., PMC3976162); doubled within the published range. VERIFY (calibrated:
  # P50 is a different trait from conductivity, and no opened source gives 4.0;
  # PMC6025199 is Zhang et al. 2018, not Klepsch)
  xylem_conductivity: 4.0
  # Xylem area per unit leaf area served (Huber value, m2 m-2): 1.24e-4 at
  # the base of current-year birch shoots ([OP22] Table 1; xylem
  # cross-section over the shoot's leaf area).  Conducting area is then
  # counted as the pipe model's additive pipes, so it stays about constant
  # down the path, as measured in birch crowns (Sellin & Kupper 2006, Trees
  # 20:311: HV even rises towards the base).  null = the visible-wood pipes
  # merged with the branching exponent, which made it 4x too high at the
  # shoots and fall towards the stem.
  huber_value: 1.24e-4
  # Vessels widen from twig tips towards the stem base (Anfodillo et al.
  # 2006, New Phytol. 169:279; Olson et al. 2014, Ecol. Lett. 17:988), and
  # conductivity goes with vessel diameter squared, so thin wood conducts
  # worse: k_s(r) = xylem_conductivity * min(1, (r / reference)^exponent).
  # This is what makes long runs of thin branches expensive. VERIFY
  conductivity_reference_radius: 0.02
  conductivity_exponent: 0.7
  # Root wood conducts better than stem wood (wider vessels). VERIFY
  root_xylem_conductivity: 4.0
  # Stomata start closing at psi_stomata_open and are shut at
  # psi_stomata_closed (MPa); silver birch is drought-sensitive and
  # cavitation-prone. VERIFY
  psi_stomata_open: -1.0
  psi_stomata_closed: -2.0
  # Expansion is full above psi_full_expansion and stops at the turgor-loss
  # point (MPa) [K04]. VERIFY: Hannus et al. 2021 (doi 10.1007/s00468-020-02059-7)
  # measured a mean of -2.47 in B. pendula, -2.32 to -2.94 in subsp. pendula.
  psi_full_expansion: -0.9
  psi_turgor_loss: -2.1
  # Which water potential drives expansion: "predawn" (soil water potential
  # minus the gravitational gradient, 0.0098 MPa/m: shoots and leaves expand
  # mostly at night and early morning, after the tree has rehydrated) or
  # "midday" (the transpiring potential, which also closes the stomata).
  expansion_water_potential: predawn

roots:
  # Root growth (roots.py): bud competition for soil water.
  # Structural root segment (m); fine roots are represented by the uptake of
  # young segments, not drawn. VERIFY
  segment_length: 0.05
  # Longest annual extension of a root tip (m). VERIFY
  max_extension_per_year: 0.8
  # Radicle of the germinating seed, in segments.
  radicle_segments: 2
  # Root tip radius (m) for the pipe model. VERIFY
  tip_radius: 0.001
  # Roots never come closer to the surface than this (m).
  min_depth: 0.02
  # Silver birch has no lasting taproot: the seedling's vertical tap root
  # turns horizontal after ~30 cm or is overtaken by side roots [L35]; its
  # pull fades with this time constant (years). VERIFY
  taproot_fade_years: 4
  # ... and stops at this depth (m), so the main laterals leave from the
  # root collar zone. VERIFY
  taproot_max_depth: 0.4
  # Gravitropic set-points (deg from vertical-up; 180 = straight down) and
  # strengths (1/m).  Main laterals run nearly horizontally in the top soil,
  # most root length lies in the top 20-30 cm (76 % of fine roots in the
  # top 20 cm in a young Estonian birch stand; ~45/37/18 % in 0-10/10-20/
  # 20-30 cm in a Swedish B. pendula plantation). VERIFY
  taproot_setpoint_deg: 180
  taproot_gravitropism_per_m: 3.0
  lateral_setpoint_deg: 97
  lateral_setpoint_spread_deg: 4
  lateral_gravitropism_per_m: 1.5
  # Sinker roots drop from main laterals near the stem to the compact
  # subsoil; birch root plates are ~0.9 m deep at the centre (31 trees,
  # Finnish re-measurement of [L35]). VERIFY
  sinker_setpoint_deg: 180
  sinker_gravitropism_per_m: 4.0
  sinker_probability: 0.06
  sinker_zone_radius: 1.5
  # Hydrotropism towards the wettest nearby soil (1/m) and random wander
  # (1/sqrt m). VERIFY
  hydrotropism_per_m: 0.8
  direction_noise_per_sqrt_m: 0.25
  probe_radius: 0.15
  # Lateral roots leave their parent at this angle (deg). VERIFY
  branch_angle_deg: 70
  # Borchert-Honda split for roots, as for shoots. VERIFY
  apical_dominance: 0.7
  apical_control: 0.55
  primordium_weight: 0.5
  # A primordium forms a lateral root with at least this many segments of
  # resource, and dies unused after this many years. VERIFY
  lateral_threshold: 3.0
  primordium_lifespan: 2
  # The root collar (the taproot zone): a birch seedling forms its main
  # laterals from the upper taproot in the first years and they radiate
  # evenly around the stem [L35].  Collar primordia need less to break, stay
  # viable longer, sit at a fixed divergence around the taproot (lateral
  # roots form opposite the xylem poles), and share the budget along the
  # taproot without favouring the deeper ones. VERIFY
  collar_primordium_weight: 1.0
  collar_lateral_threshold: 1.0
  collar_primordium_lifespan: 10
  collar_divergence_deg: 137.5
  collar_apical_control: 0.5
  # Water draw-down: availability falls as exp(-k * RLD) with the tree's own
  # absorbing root length density RLD (m/m^3), blurred over the depletion
  # radius (m) around each root. VERIFY
  depletion_coefficient: 0.004
  depletion_radius: 0.12
  # Roots younger than this (years) carry the fine-root cloud that takes up
  # water. VERIFY
  absorbing_years: 3
  # Uptake conductance per metre of absorbing structural root in fully
  # available soil (kg s^-1 MPa^-1 m^-1).  Calibrated against 5-year-old
  # silver birch saplings (Sellin et al. 2014, BMC Plant Biol. 14:72, PMC3976162):
  # soil-to-branch conductance 2.28 mmol m-2 s-1 MPa-1 of leaf area; at
  # 1e-5 the model's roots alone gave 1.4 and took 85-93 % of the sapling's
  # water-potential drop.  Used only when fine_root_uptake is off.
  # VERIFY (calibrated)
  uptake_conductance_per_m: 2.0e-5
  # Water enters through the fine roots the tree pays for (resource.
  # leaf_costs: 0.48 g fine root per g leaf), so their cost and their uptake
  # are one quantity.  Their length is mass x specific root length (short,
  # absorbing roots of silver birch 80-97 m g-1 across site qualities;
  # Ostonen et al. 2007, Plant Biosyst. 141:426; VERIFY: 87-97 appears in the
  # abstract of a different paper, Ostonen et al. 2007, Tree Physiol. 27:1627,
  # and 80 was not found), spread over this year's
  # absorbing roots in proportion to their length.  Conductance per metre:
  # the root-system conductance of 3-4-year-old silver birches, 4.33e-4 kg
  # m-2 s-1 MPa-1 per leaf area, with 0.46 g fine root (< 2 mm) per g leaf in
  # the same trees (control plots; Sellin et al. 2015, Front. Plant Sci.
  # 6:860), at the model's reference LMA (60.8 g m-2, [OP22]): 1.7e-7 kg s-1
  # MPa-1 per m.  The root-system conductance includes the axial path, which
  # the model adds again from the absorbing roots to the stem (small).
  fine_root_uptake:
    enabled: true
    specific_root_length_m_per_g: 90.0
    root_conductance_per_leaf_area: 4.33e-4
    fine_root_per_leaf_mass: 0.46
    leaf_mass_per_area_g_m2: 60.8
  # Tips die where availability drops below this; a lateral root is shed
  # when the mean availability at its tips and primordia does. VERIFY
  tip_survival_availability: 0.08
  shed_availability: 0.1
  # Margin of the soil grid around the roots (m).
  field_margin: 0.5
  # Zone of rapid taper: near the stem, structural roots carry extra wood
  # for anchorage and thin fast; beyond it they follow their own pipe model.
  # The zone reaches 2.2 x DBH from the stem [D05, Pinus pinaster]; the
  # extra wood fades exponentially with distance, with a length of this
  # fraction of the zone radius (13 % left at the zone edge, ~2 % at twice
  # that). VERIFY for birch
  zrt_radius_per_dbh: 2.2
  zrt_fade_fraction: 0.5
  # Near the collar growing roots keep clear of the stem column and of other
  # roots (root-stem and root-root avoidance): a push away from any root
  # closer than both radii plus the clearance (m), within this distance of
  # the stem (m).  null = off. VERIFY
  avoid_clearance_m: 0.03
  avoid_zone_radius_m: 1.5
  avoid_weight: 1.5
  # A growing root turns by at most this much per segment (deg), so
  # avoidance and tropisms bend it smoothly; stones can still deflect it
  # sharply. null = no limit. VERIFY
  max_turn_deg_per_segment: 30
  # The seedling taproot decays below the deepest living main lateral once
  # it has stopped [L35]. VERIFY
  trim_taproot: true

anchorage:
  # Root-soil plate and root strength for later storm modelling (numbers
  # only).  The plate is the zone of rapid taper: each main root counts up
  # to where it thins below this diameter (m). VERIFY
  plate_root_diameter: 0.02
  # The plate radius comes from the main structural roots: the fewest main
  # roots that carry this share of the base cross-section of all main roots,
  # weighted by cross-section. VERIFY
  plate_structural_share: 0.8
  # Plate radius rule: "taper_zone_end" (where the extra wood of the zone of
  # rapid taper has faded to 5 % along each structural root, weighted by
  # cross-section), "structural_roots_2cm" (where they thin below
  # plate_root_diameter) or "median_all_main_roots_2cm". VERIFY
  plate_radius_rule: taper_zone_end
  # Root tensile strength sigma = sigma_1mm * (d / 1 mm)^-beta (MPa): the
  # power law used for broadleaf roots (Bischetti et al. 2005, Plant Soil
  # 278:11; values for birch not published, broadleaf band). VERIFY
  tensile_strength_1mm_mpa: 30.0
  tensile_strength_exponent: 0.6
  # Windward roots slip and break progressively, so only part of their
  # breaking strength is mobilised when the plate turns over; root tension
  # is about half of anchorage in pulling tests [C86]. VERIFY
  root_strength_mobilised: 0.25
  # Empirical cross-check: tree-pulling resistance grows with H * DBH^2 for
  # uprooting [P00]; [P00] gives no birch coefficient in its abstract.
  # Silver birch pulled to uprooting in Latvia [K22, Tables 1-2], site means:
  # DBH 25.5 cm, H 29.1 m, 46.9 kN m (25 kN m/m^3); DBH 35.0 cm, H 32.8 m,
  # 154.3 kN m (38 kN m/m^3).  Mean of the two sites (computed from site
  # means, not tree-level data). ESTIMATE from [K22]
  h_dbh2_coefficient_knm_per_m3: 31.0
  h_dbh2_coefficient_range: [25.0, 38.0]
  # Critical turning moment, ForestGALES-style: an empirical regression of
  # tree-pulling moments on stem size, M = C_reg x stem volume.  Silver birch
  # pulled to uprooting [K22, Tables 1-2], site means: V 0.67 m3, 46.9 kN m;
  # V 1.43 m3, 154.3 kN m; least squares through the origin gives
  # C_reg = 101 kN m per m3 of stem.  Adjusted for the simulated rooting
  # depth (deepest root within rooting_depth_radius_m, capped by the soil)
  # against the uprooted plates of [K22] (0.84-0.85 m deep), and, by wind
  # direction, for root asymmetry: root_tension_share of the moment comes
  # from windward root tension, about half in pulling tests [C86]. VERIFY
  # (depth factor limits)
  critical_moment_per_stem_volume_knm_per_m3: 101.0
  rooting_depth_radius_m: 1.5
  reference_rooting_depth_m: 0.85
  depth_factor_min: 0.5
  depth_factor_max: 1.2
  root_tension_share: 0.5


# The height limit, off by default: the approved site-index curve limits how much the leader may grow in a
# year, instead of height emerging from the carbon split.  It's a limit, not a script: the leader still makes
# real nodes that cost carbon, paid first from the year's pool, and it falls short of the curve when its light,
# the crown's water or the pool run short (growth.py, _height_limit_plan).  No height is set and no node is moved.
# Curve: Eriksson et al. 1997 as in Elfving 2010, Appendix 9, with reference.height's asi, beta and b2.
height_driver:
  enabled: false
  # Site index, H at breast-height age 50 (m).  20-26 spans the target's Swedish range; 23 is its middle.
  site_index: 23.0
  reference_age_years: 50.0
  # T13 = 150 / SIS, SIS the curve's own height at total age 100 (Elfving 2010, Appendix 7, p. 56).
  t13_numerator: 150.0
  sis_total_age_years: 100.0
  # TUNED, against nothing yet: canopy light at the leader (relative) from which light no longer limits it.
  light_full: 0.6
  light_exponent: 1.0
  # TUNED, against nothing yet: crown's stomatal opening from which water no longer limits the leader.
  water_full: 0.8
  # TUNED, against nothing yet: after a loss (browsing), the leader may grow this many times the curve's
  # increment until it's back.  Lost height doesn't come back this way in a real tree: a departure, in the report.
  catch_up: 1.25
  # Heritable growth factor: a plot tree's alpha over this scales its limit.  4.8 is alpha's default.
  reference_alpha: 4.8
  # TUNED, against nothing yet: the most leaf area the side shoots may add in a year, as a multiple of what the
  # crown has now.  A sink limit standing in for nutrients and competition, without which a small tree held to the
  # curve spends its carbon on thousands of shoots and starves on their upkeep.  null = no limit.
  leaf_growth_max: 1.5
  # TUNED, against nothing yet: no side shoot longer than this share of the leader's shoot this year.  null = no limit.
  lateral_cap_ratio: null
  # Once the leader has lost dominance (resource.reiteration), whichever tip stands highest carries the height, and
  # reiterated limbs aren't held to the side shoot cap, so the leader can be lost in the crown.  false: the stem's own tip, always.
  leader_lost_in_crown: false
  # TUNED, against nothing yet: the most of the pool the year's rings may take; the rest of their need waits.  null = no limit.
  ring_share_max: null
  # TUNED, against nothing yet: the share of each year's pool that waits for next year (a small carbon store).  null = none.
  store_fraction: null

# Field-layer competition on clearcuts (Option A, Nilsson & Örlander 1999).
# Sourced clear-cut field-layer sward growth and light extinction.
# Off by default.
field_layer_competition:
  enabled: false
  max_height_m: 0.45           # Mean mature grass sward height (Nilsson & Örlander 1999)
  max_lai: 3.3                 # Mature sward LAI (~3 Mg/ha aboveground biomass; Nilsson & Örlander 1999)
  extinction: 0.45             # Beer-Lambert k for erectophile grass canopy (Nilsson & Örlander 1999)
  years_to_mature: 4.0         # Years post-harvest to reach peak sward biomass (Nilsson & Örlander 1999)

# Seedling germination phase (Option off by default)
# Models seedling emergence from seed reserves (~0.2 mg) and cotyledons (~0.05 cm2),
# with heterotrophic germination respiration and ontogenetic juvenile leaf scaling.
germination:
  enabled: false
  # Seed dry mass ~0.21 mg (Perala & Alm 1990; Miles 1974; Grime et al. 1988:
  # none opened).  USDA Woody Plant Seed Manual, Betula, Table 4: ~0.19 mg per
  # cleaned de-winged B. pendula seed (range 0.09-0.30). VERIFY
  seed_dry_mass_mg: 0.21
  # Cotyledon photosynthetic area ~0.05 cm2 = 5e-6 m2 (Perala & Alm 1990;
  # Laitakari 1935: not opened).  Not used by the code. VERIFY
  cotyledon_area_cm2: 0.05
  # Heterotrophic respiration loss of seed reserves during germination prior to autotrophy
  # (Bewley & Black 1994; Penning de Vries et al. 1979: not opened; no Betula
  # source found, phase 40). VERIFY
  germination_respiration_fraction: 0.35
  # Initial hypocotyl height at emergence (m). VERIFY
  hypocotyl_height_m: 0.015
  # Initial radicle taproot depth at emergence (m). VERIFY (not yet hooked to root system)
  initial_taproot_depth_m: 0.02
  # Integrated seasonal photosynthetic leaf equivalent over year 1 as cotyledons expand to first leaves
  # (Ingestad 1979; Karlsson 2002; Konopka et al. 2023). VERIFY (effective seasonal calibrated scalar)
  first_year_effective_leaves: 0.20
  # Breast-height reference where heteroblastic juvenile leaves reach adult size (m).
  # No source: no published leaf-size vs height relation for young Betula found
  # (phase 40); the linear ramp in growth.py is invented. VERIFY
  juvenile_scale_bh_m: 1.3
  # Minimum juvenile leaf scale at emergence (~3 cm2 juvenile leaf vs 15 cm2 adult;
  # neither value has a source, phase 40). VERIFY
  min_juvenile_scale: 0.20

# Soil water balance option (season bucket, off by default): BILJOU, Granier,
# Breda, Biron & Villette 1999 (Ecol. Modell. 116:269), stepped daily with
# monthly climate spread evenly over each month (growth.py
# _run_soil_water_balance).  No rainfall interception: BILJOU's (Aussenac
# 1968, Granier 1999 Eq. 3) is a daily-rain equation.  How the result cuts
# carbon has no opened source (VERIFY; KNOWN_ISSUES phase 40).
soil_water_balance:
  enabled: false
  # Extractable water of the rooting zone at field capacity, mm (EWM).
  # Cited as Lundin et al. 1999 (Agric. For. Meteorol. 98-99:53) Table 1
  # for 0.7 m of till; not opened (paywalled). VERIFY
  awc_mm: 75.0
  # REW below which transpiration declines linearly: 0.4 (Granier 1999
  # p. 271 and Table 1; Breda et al. 2006, Ann. For. Sci. 63:625, p. 630)
  rew_threshold: 0.40
  # Maximum transpiration / PET = 0.125 LAI up to LAI 6, then 0.75
  # (Granier 1999 Eq. 2, p. 271: the relationship the authors adopted; their
  # fitted curve, Fig. 1, is quadratic, over several forest types, no birch)
  transpiration_lai_slope: 0.125
  transpiration_ratio_max: 0.75
  # Precipitation May-Sep, mm: SMHI 1991-2020 normals, Uppsala station 97520
  # (Normal-nbd-1991-2020.xlsx, smhi.se)
  precipitation_mm: [39.3, 61.2, 57.4, 73.6, 48.6]
  # Penman (1953) PET May-Sep, mm, computed for Forsmark (coastal north
  # Uppland) 1970-2004: SKB TR-06-45 (Gustafsson et al. 2006) Table A1-10, p. 44
  pet_mm: [79.8, 98.9, 103.4, 68.5, 30.1]
  # drought_scenario: use the 2018 precipitation, Uppsala 97520, SMHI open
  # data (parameter 23, monthly sums): dry May-June, wet July-August; its
  # May-Sep total (272 mm) is close to the normal (280 mm).  PET stays the
  # 1970-2004 Forsmark mean (no 2018 PET opened).
  dry_year_precipitation_mm: [6.8, 26.5, 89.1, 105.1, 44.6]
  drought_scenario: false

# How the tree looks, for treegen/appearance.py, treegen/textures.py and tools/game_export.py.
# Growth reads nothing in this block, so no value here can change a growth number.
# Another species needs a block like this one and no new code.
# No true/false values and no integer key called "stage" in this block: run manifests list those
# as options, and the golden hash would count them.
# Every number here is covered by a line in "provenance": SOURCE means read from the paper or
# dataset named, DERIVED worked out from a source with a stated step, TUNED chosen by eye or
# against what it says, with no direct source. Colours are sRGB 0-255 unless named _linear.
appearance:
  provenance:
    bark.thickness.hansen_double_mm: "SOURCE: Hansen, Rahlf, Astrup & Gobakken 2023, Scand. J. For. Res. 38:413, doi:10.1080/02827581.2023.2243821, as coded in taperNOR 0.2.1 (tools/bark.py). Birch, Norwegian NFI."
    bark.thickness.calibration: "DERIVED: Vihera-Aarnio & Velling 2017, Silva Fennica 51(4):7731, Table 5, age 22, single wall, over Hansen's single wall at the same diameter: 0.61, 0.62 at 3 m, 0.61, 0.59 at 6 m."
    bark.thickness.rough_ratio: "DERIVED: same Table 5, Tuusula: 11.4 mm at the stump against 3.6 mm at the calibrated baseline (Hansen at a 14 cm stump x 0.61); the 14 cm stump is an estimate."
    bark.thickness.min_fraction_of_diameter: "DERIVED: same Table 5, walls at 3 m and 6 m over the diameter there from taperNOR: 2.5-2.6 %. Hansen goes negative on twigs, so this floor is carried down to them, which nobody measured."
    bark.thickness.fissure_depth_fraction: "TUNED: by eye on the close-up renders; how deep a fissure runs into the bark has no source here."
    bark.tile_size_m: "TUNED: a size that holds several plates and lenticels at under 0.5 mm a texel."
    bark.tile_px: "TUNED: game setting."
    bark.stem_texture_px: "TUNED: game setting."
    bark.atlas_px: "TUNED: game setting."
    bark.branch_circumference_m: "TUNED: game setting, doubling classes."
    bark.stem_rows: "TUNED: game setting: most rows where a player stands next to the stem."
    bark.stages: "TUNED: every colour, roughness and pattern size in the stages, by eye on the renders, with the maintainer's description (red-brown twigs; white with dark lenticels and peeling strips; rough black base) and birch-data/REPORT.md section 14, an unsourced summary. No measured bark reflectance or lenticel survey was opened."
    bark.stage_ramps.papery: "TUNED: against the sequence in birch-data/REPORT.md section 14 (red-brown to about year 5, white after), which gives no source; the size limit by eye. Trockenbrodt 1991 and 1994 (IAWA) should hold birch bark by age: brill.com answered 403, not read."
    bark.stage_ramps.rhytidome.climbs.onset_age: "TUNED: so the zone sits between the stump and 1.3 m at age 22."
    bark.stage_ramps.rhytidome.climbs.height_max_m: "TUNED: so the top is 2.6 m at 60 and 3.2 m at 80, inside the 2-4 m at 60-80 of birch-data/REPORT.md section 14, which gives no source. No primary source for the climb was found: gardening and nursery pages say only 'black and fissured at the base with age'."
    bark.stage_ramps.rhytidome.climbs.time_constant_years: "TUNED: as height_max_m. One anchor comes from a measurement, by proxy: thick bark at the stump and little extra at 1.3 m at age 22 (Vihera-Aarnio & Velling 2017, Table 5), read as where the rough bark is."
    bark.stage_ramps.rhytidome.climbs.band_m: "TUNED: as height_max_m; by eye for the uneven upper edge."
    bark.stage_ramps.rhytidome.diameter_m: "TUNED: by eye; thin parts stay smooth at any age."
    bark.peel: "TUNED: by eye on the renders; no survey of peeling by age or size was opened. The stem's white bark peels in thin horizontal sheets (birch-data/REPORT.md section 14, no source)."
    bark.marks: "TUNED: by eye; the dark chevrons above branches are a known birch feature, no measurement."
    leaves.chlorophyll_ramp: "SOURCE: LOPEX93 (Hosgood et al. 1993, EcoSIS, CC0) via tools/leaf_colour_table.py: birch 306-310 at 1.0; linden 86-90 and wild grape 11-15 at 0.5; soybean 321-325 at 0.038, the only yellow leaves in it; log-space mix between (an assumption). Birch itself is measured only at 1.0."
    leaves.yellow_lift: "TUNED: by eye for the maintainer's autumn yellow: the only yellow leaf measured is a soybean, browner than a birch in autumn. No yellow birch leaf was opened. Takes the top of the ramp from ochre to yellow, with the measured ramp left as it is."
    leaves.summer_chlorophyll_ug_cm2: "SOURCE: LOPEX93 metadata, Betula pendula samples 306-310."
    leaves.summer_carotenoid_ug_cm2: "SOURCE: LOPEX93 metadata, Betula pendula samples 306-310. Kept through senescence: Zhang, Dai & Ge 2020, Sci. Rep. 10:9039, doi:10.1038/s41598-020-65704-8 (other species)."
    leaves.specular_f0: "TUNED: the usual dielectric PBR value; taken off the measured reflectance, which includes the leaf's shine, so it isn't counted twice."
    leaves.season: "TUNED: day-of-year timing by eye for central Sweden, no birch series opened (the Turku and Tree-journal papers were blocked). The 50 % and 95 % chlorophyll marks are the leaf-colouring start and end of Zhang, Dai & Ge 2020 (other species)."
    leaves.light_effect: "TUNED: by eye; a sun leaf paler than a shade leaf, read from the model's own LMA."
    leaves.turn_spread_days: "TUNED: by eye. Senescence is patchy and spread out in time (Zhang, Dai & Ge 2020); how much is a guess."
    leaves.long_shoot_delay_days: "TUNED: by eye; late leaves on long shoots colour after short-shoot leaves, no value opened."
    leaves.old_tree_advance_days: "TUNED: by eye; old trees turn a little earlier than young ones, no value opened."
    leaves.interveinal_lead: "TUNED: by eye. Chlorophyll goes first between the veins: a search abstract only (fp24012, Funct. Plant Biol.), not read in full."
    leaves.shape: "TUNED: by eye for a birch's triangular, double-toothed blade; the aspect of 1.4 as tools/render_stand.py had it."
    leaves.inclination_deg: "TUNED: from tools/render_stand.py; steep leaves, as K_PAR 0.37 in Hagemeier & Leuschner 2019 implies."
    leaves.petiole_m: "TUNED: from the 1-2 cm petiole in this file's light.leaf_spread comment, which gives no paper."
    leaves.fold_deg: "TUNED: by eye."
    leaves.texture_size_px: "TUNED: game setting."
    game: "TUNED: game settings, no engine or budget named yet. Every budget and size here is a setting."
  bark:
    thickness:
      # double bark (mm) = b0 + b1 DBH + b2 d, over-bark cm; the model's radii are wood
      hansen_double_mm: [-0.48552367, 0.04957885, 0.84676248]
      calibration: 0.61
      rough_ratio: 3.2
      min_fraction_of_diameter: 0.026
      fissure_depth_fraction: 0.72
    tile_size_m: 0.5
    tile_px: 1024
    # stem texture: width, height. stem_rows gives the share of rows below each height, so the part
    # near the ground gets the most: here 1.5 mm a row to 3 m, then 5 mm to 10 m, then the rest
    stem_texture_px: [1024, 4096]
    stem_rows: [[3.0, 0.48], [10.0, 0.82]]
    # branch atlas: width, height; one column per circumference class, each a whole turn of the branch
    atlas_px: [2048, 1024]
    branch_circumference_m: [0.015, 0.03, 0.06, 0.12, 0.24, 0.48]
    # When each stage after the first takes over, from a part's own age and over-bark diameter
    # (each pair is a ramp, low to high, and all must pass). "climbs" is a stage that starts at
    # the base and rises: top = height_max (1 - exp(-(part age - onset) / time)).
    stage_ramps:
      papery:
        part_age_years: [4.0, 10.0]
        diameter_m: [0.012, 0.042]
      rhytidome:
        diameter_m: [0.05, 0.10]
        climbs: {onset_age: 10.0, height_max_m: 6.0, time_constant_years: 90.0, band_m: 0.7}
    # Layered in this order, each covering the last through its own pattern as its weight rises.
    stages:
      - name: twig
        colour: [86, 44, 34]
        colour_variation: [62, 30, 26]
        blotch_m: [0.03, 0.12]
        roughness: 0.40

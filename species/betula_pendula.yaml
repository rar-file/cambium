# Silver birch, Betula pendula Roth.
#
# Every parameter the growth model reads is in this file.  Each value says
# where it comes from.  VERIFY = estimated or tuned by eye, not taken from a
# measurement; treat those as the first things to revisit.
#
# Key references
#   [P09]  Palubicki W., Horel K., Longay S., Runions A., Lane B., Mech R.,
#          Prusinkiewicz P. 2009. Self-organizing tree models for image
#          synthesis. ACM Trans. Graph. 28(3):58.
#   [BH84] Borchert R., Honda H. 1984. Control of development in the
#          bifurcating branch system of Tabebuia rosea. Bot. Gaz. 145:184-195.
#   [S64]  Shinozaki K., Yoda K., Hozumi K., Kira T. 1964. A quantitative
#          analysis of plant form - the pipe model theory. Jpn. J. Ecol. 14.
#   [M82]  Maillette L. 1982. Structural dynamics of silver birch. I. The
#          fates of buds; II. A matrix model of the bud population.
#          J. Appl. Ecol. 19:203-218, 219-238.
#   [A92]  Atkinson M.D. 1992. Betula pendula Roth and B. pubescens Ehrh.
#          Biological Flora of the British Isles. J. Ecol. 80:837-870.
#   [E97]  Eriksson H., Johansson U., Kiviste A. 1997. A site-index model for
#          pure and mixed stands of Betula pendula and B. pubescens in Sweden.
#          Scand. J. For. Res. 12:149-156.
#   [H05]  Hemery G.E., Savill P.S., Pryor S.N. 2005. Applications of the
#          crown diameter-stem diameter relationship for different species of
#          broadleaved trees. For. Ecol. Manage. 215:285-294.
#   [H10]  Hynynen J. et al. 2010. Silviculture of birch in northern Europe.
#          Forestry 83:103-119.
#   [CK66] Clausen J.J., Kozlowski T.T. 1965. Heterophyllous shoots in
#          Betula papyrifera. Nature 205:1030.  Early and late leaves of birch
#          long shoots; short shoots with unelongated internodes.
#   [J00]  Jirasek C., Prusinkiewicz P., Moulia B. 2000. Integrating
#          biomechanics into developmental plant models expressed using
#          L-systems. Plant Biomechanics 2000, 615-624.
#   [AF09] Almeras T., Fournier M. 2009. Biomechanical design and long-term
#          stability of trees. J. Theor. Biol. 256:370-381.
#   [L35]  Laitakari E. 1935. The root system of birch (Betula verrucosa and
#          odorata). Acta Forestalia Fennica 41.
#   [K04]  Koch G.W., Sillett S.C., Jennings G.M., Davis S.D. 2004. The limits
#          to tree height. Nature 428:851-854.
#   [P00]  Peltola H., Kellomaki S., Hassinen A., Granander M. 2000. Mechanical
#          stability of Scots pine, Norway spruce and birch: an analysis of
#          tree-pulling experiments in Finland. For. Ecol. Manage. 135:143-153.
#   [C86]  Coutts M.P. 1986. Components of tree stability in Sitka spruce on
#          peaty gley soil. Forestry 59:173-197.
#   [D05]  Danjon F., Fourcaud T., Bert D. 2005. Root architecture and
#          wind-firmness of mature Pinus pinaster. New Phytol. 168:387-400.
#   [K22]  Krisans O., Caksa L., Matisons R., Rust S., Elferts D., Seipulis A.,
#          Jansons A. 2022. A static pulling test is a suitable method for
#          comparison of the loading resistance of silver birch between urban
#          and peri-urban forests. Forests 13:127.
#   [SS14] Rytter L., Karlsson A., Karlsson M., Stener L.-G. 2014. Skotsel av
#          bjork, al och asp. Skogsskotselserien nr 9, Skogsstyrelsen.
#   [HL19] Hagemeier M., Leuschner C. 2019. Functional crown architecture of
#          five temperate broadleaf tree species: vertical gradients in leaf
#          morphology, leaf angle, and leaf area density. Forests 10:265.
#   [OP22] Ounapuu-Pikas E., Venisse J.-S., Label P., Sellin A. 2022. Leaf and
#          branch hydraulic plasticity of two light-demanding broadleaved tree
#          species differing in water-use strategy. Forests 13:594.
#   [K18]  Klepsch M. et al. 2018. Is xylem of angiosperm leaves less resistant
#          to embolism than branches? J. Exp. Bot. 69:5611-5623.
#   [LA82] Laasasenaho J. 1982. Taper curve and volume functions for pine,
#          spruce and birch. Commun. Inst. For. Fenn. 108.

species:
  scientific_name: Betula pendula Roth
  common_name: silver birch

shoot:
  # One model metamer = one real node: internode + leaf + axillary bud.
  # Long-shoot internode length (m).  Birch long shoots carry their leaves in
  # two ranks with internodes of a few cm; the nearest measured value found
  # for Betula is 3.2 cm node spacing on 48 cm annual shoots of B. papyrifera
  # (US plant patent PP15768); weaker B. pendula shoots are shorter-jointed.
  # VERIFY
  internode_length: 0.025
  # Short-shoot internodes do not elongate beyond a few mm [CK66]; a short
  # shoot adds ~2 mm and 2-3 leaves a year.  Recorded for leaf placement;
  # short shoots are not meshed. VERIFY
  short_shoot_internode_length: 0.002
  # Longest annual shoot near the ground: ~1.2 m/yr, the upper end of
  # juvenile birch leader growth.  In metres; the number of metamers follows
  # from internode_length. VERIFY
  max_shoot_length: 1.2
  # Internode length and leaf size scale with turgor-driven expansion,
  # computed from leaf water potential (see hydraulics [K04]); this floor
  # keeps internodes at least ~5 mm. VERIFY
  min_expansion: 0.2
  # Shoots are kept this far above the ground plane (m). Model guard.
  min_height_above_ground: 0.05
  # A descending shoot apex below this height has reached the herb layer
  # and stops (contact, browsing). VERIFY
  ground_contact_height: 0.4
  # A shoot that would grow into the ground stops there (its bud is spent)
  # instead of turning along it, and tips in the ground layer stop unless
  # they are clearly climbing; false = deflect along the ground.
  stop_at_ground: true

resource:
  # Borchert-Honda resource at the base, v_base = alpha * Q_base [P09 Sec. 5.1].
  # Sets how many metamers an unshaded, fully watered bud can produce.
  # VERIFY (tuned to Swedish height curves [E97] and open-grown crown size [H05]).
  # 4.6 while respiration was ~3 % of the fixed carbon; re-tuned with explicit
  # respiration (CUE ~0.5), maintenance paid from the pool, the 3-metamer
  # long-shoot gate and self-financing short shoots (phase 15): at 5.6 the
  # plots' mean height is 19.2-19.7 / 23.3-23.7 / 25.6-25.7 m at 30 / 45 /
  # 60, top quarter 20.9-21.1 / 24.9-25.3 / 27.0-27.3 m (band 13.4-19.7 /
  # ~18-24 / 21.1-26.9); 6.0 put the plots' top quarter 2-3 m above the band.
  # Single seed 1 forks at the base at 5.2-5.6 (slow canopy closure), the
  # plot trees do not.
  alpha: 5.6
  # The BH split weight lambda [P09 Eq. 3, BH84] (lambda > 0.5 favours the
  # main axis) is used with two values, following the botanical distinction
  # between apical dominance (the apex suppressing its own lateral buds) and
  # apical control (the leader restraining established branches) (Brown,
  # McAlpine & Kormanik 1967, Am. J. Bot. 54:153; Wilson 2000, Am. J. Bot.
  # 87:601).  P09 uses a single lambda for both.
  # Apical dominance, used where the lateral is still a bud or spur.  Strong
  # in birch: most lateral buds stay short shoots [M82]. VERIFY
  apical_dominance: 0.62
  # Apical control, used where the lateral is a branch.  Strong when young
  # (excurrent leader, conical crown), weaker when old (rounder, more open
  # crown) [A92].  Logistic transition between the two values.
  # VERIFY (all four)
  apical_control_young: 0.60
  apical_control_old: 0.50
  apical_control_transition_age: 22
  apical_control_transition_width: 6
  # Gravimorphism: shoot orientation changes vigour; upward shoots are more
  # vigorous than horizontal or hanging ones (Wareing & Nasr 1961, Ann.
  # Bot. 25:321).  BH weight of a bud = Q * max(0.05, 1 + g * d_z). VERIFY
  gravimorphism: 1.0
  # Physiological ageing of meristems (Barthelemy & Caraglio 2007, Ann.
  # Bot. 99:375): the sink strength of all buds on a first-order branch
  # decays as exp(-branch_age / branch_aging_years), so old scaffold branches
  # produce ever shorter shoots, lose out to the young upper crown and are
  # shed.  Buds on the stem age with the tree, more slowly; that is the loss
  # of apical control that rounds the top of an old birch [A92]. VERIFY
  branch_aging_years: 20
  stem_aging_years: 45
  # A limb's meristems start at the physiological age the stem had when it
  # made them [Barthelemy & Caraglio 2007], instead of at zero.  false: a
  # limb born at 45 near the top was 2.4x as vigorous as the 45-year-old
  # leader's buds and overtopped it (the V-shaped twin top).  Stand seed 1:
  # the leader then stays on top from 45 to 60 (it was overtopped by 1.25 m).
  limbs_inherit_stem_age: true
  # Loss of dominance and reiteration.  Birch crowns are hierarchic while
  # young; in the third phase "the branches and the extremity of the main stem
  # assume a divaricated structure with very short growth units" and the
  # trunk ends in forks (Millet, Bouchard & Edelin 1999, Ecoscience 6:187,
  # grey birch).  In Barthelemy & Caraglio's (2007) terms the adult crown is
  # built by reiteration: well-lit, vigorous upper limbs become reiterated
  # complexes, partly rejuvenated, with an orthotropic axis of their own
  # (ARCHI "duplication": the trunk gives rise to axes identical to itself in
  # its ageing sequence).  Triggers: the tree in its adult phase (min_age);
  # the leader's yearly growth below decline_fraction of its peak; the limb
  # attached in the upper
  # upper_crown_fraction of the crown, its tip lit at min_light or more and
  # at least min_relative_vigour of the leader's.  Reiteration is sequential:
  # the most vigorous eligible limb becomes a complex, the next one no sooner
  # than interval_years later.  A complex's physiological age is multiplied
  # by rejuvenation and then ages like the stem. VERIFY (all values: no
  # published thresholds found; interval_years set so that about six
  # complexes form between 30 and 60, as the 4-7 major limbs in the
  # reference photos)
  reiteration:
    enabled: true
    min_age: 30
    decline_fraction: 0.5
    upper_crown_fraction: 0.25
    min_light: 0.8
    min_relative_vigour: 0.3
    interval_years: 5
    rejuvenation: 0.5
    setpoint_angle_deg: 0
  # Maintenance cost of one living internode, in metamer units per year,
  # charged as resource flows acropetally (LIGNUM carbon balance,
  # Perttunen et al. 1996, Ann. Bot. 77:87).  Branches that cannot pay
  # for themselves starve and are shed.  Calibrated (with
  # growth_respiration_coefficient below) to a whole-tree carbon use
  # efficiency of ~0.47: seed 1 stand, mean CUE 0.50 over ages 20-60
  # (0.02 before gave 0.78 with growth respiration, ~0.96 without).
  # VERIFY (calibrated)
  maintenance_per_internode: 0.7
  # Growth respiration: g C respired per g C built into new tissue (shoots,
  # wood, roots), ~0.25 (Ryan 1991, Ecol. Appl. 1:157; VERIFY).  New wood
  # and shoots are built from the carbon left after maintenance and growth
  # respiration; maintenance_per_internode is set so that the tree's carbon
  # use efficiency NPP/GPP is ~0.47, the value for temperate and boreal
  # forests (Waring et al. 1998, Tree Physiol. 18:129: 0.47 +- 0.04, range
  # 0.40-0.52; Collalti & Prentice 2019, Tree Physiol. 39:1473: 0.46 +-
  # 0.12; boreal at the low end, DeLucia et al. 2007, Glob. Change Biol.
  # 13:1157).
  growth_respiration_coefficient: 0.25
  # Branch autonomy (Sprugel, Hinckley & Schaap 1991, Annu. Rev. Ecol.
  # Syst. 22:309): a first-order limb lives on the carbon its own leaves fix,
  # imports none and exports this fraction to the stem; the stem pool (the
  # stem's own leaves plus exports) feeds only the leader and the buds on
  # the stem.  Water stays shared through the roots.  A limb whose own
  # carbon cannot pay its upkeep is shed.  null = one shared pool (P09).
  # Tried at 0.1-0.35 without, and at 0.1-0.2 with, young-limb import: the
  # dominant limbs stay the seedling-era ones at the base and the leader
  # drops below the height band (see KNOWN_ISSUES.md).  Off.
  # VERIFY
  branch_export_fraction: null
  # Young limbs import from the stem pool (their Borchert-Honda share) until
  # their own carbon covers what they drew the year before, i.e. they have
  # become net exporters; then they run on their own budget.  No constant:
  # the switch is the limb's own carbon balance.
  young_limbs_import: true
  # Carbon split between crown and roots: functional balance (Brouwer 1963;
  # Thornley 1972 Ann. Bot. 36:431) sends more to the roots the more the
  # leaves are water-limited.  Root share runs from min (no water stress)
  # to max (stomata shut).  Birch allocates ~25-40 % of production below
  # ground including fine-root turnover. VERIFY
  root_share_min: 0.25
  root_share_max: 0.6
  # Root segments (segment_length each) built per unit of carbon, relative
  # to one shoot metamer. VERIFY
  root_segments_per_unit: 0.2

bud_fate:
  # A bud with v forms floor(v) metamers [P09].  Axis tips extend with v >= 1;
  # a lateral bud forms a long shoot with v >= this many metamers, otherwise
  # a short shoot.  Birch shoots are dimorphic: a lateral bud makes either a
  # short shoot (2-3 leaves on an unelongated axis) or a long shoot with
  # several elongated internodes [M82]; a bud that can afford only 1-2
  # metamers makes a short shoot.  P09's rule (1) was tried in phase 14: it
  # made 12x as many 1-2-node third-order shoots, doubled the local leaf
  # density around twig buds (3.8 -> 7.3 m2/m3 within 0.25 m) and halved the
  # survival of second-order shoots (99 -> 53 % after 5-8 years), seed 1 at
  # 25 years (phase 15). VERIFY (the value 3)
  long_shoot_threshold: 3.0
  # Short shoots are cheap and self-financing, so their fate is local and
  # driven by light, not by BH resource: a lateral bud that does not extend
  # forms a short shoot (spur) if its exposure Q reaches short_shoot_light;
  # most lateral buds of a birch long shoot become short shoots [M82].
  # A non-extending shoot tip also lives on as a short shoot while lit. VERIFY
  short_shoot_light: 0.30
  # A spur dies when its exposure falls below this: the lowermost shade
  # leaves of Betula pendula stands sit at 21 % relative light (median of
  # 120-150 measurements; Hagemeier & Leuschner 2019, Forests 10:925).
  short_shoot_survival_light: 0.21
  # A spur releases a long shoot only with clearly more resource than a fresh
  # bud; release of short shoots into long shoots is uncommon [M82]. VERIFY
  spur_release_threshold: 6.0
  # Short shoots are self-financing [M82]: they fix carbon with their own
  # leaves and are no sink in the Borchert-Honda split (no release then).
  # As sinks they took 73 % of the shoot resource (seed 1, years 15-30) and
  # wasted it, so sub-branches stopped extending after their first year:
  # 0.054 m2 of leaf and 0.51 cm at 12 years (phase 15).
  short_shoots_self_financing: true
  # A bud that will not grow this year (a tip below one metamer, a fresh
  # lateral below long_shoot_threshold) is no sink: the split is made again
  # among the buds that grow.  Without it, buds that became short shoots
  # took 45 % of the resource unused (seed 1, years 15-30; phase 15).
  idle_buds_no_sink: false
  # Short-shoot lifespan in years; birch short shoots persist for several
  # years [M82].  null: no fixed lifespan, a short shoot dies only of light
  # (below short_shoot_survival_light); 8 years made the lower limbs of a
  # stand tree leafless once their aged meristems stopped making new ones.
  spur_lifespan: null
  # Years an unbroken lateral bud stays viable; birch builds few epicormic
  # shoots from old dormant buds [A92]. VERIFY
  dormant_bud_lifespan: 3

light:
  # Voxel edge (m) for shadow propagation [P09 Sec. 4.2]: ~4 internodes,
  # about one leaf length.  Results are insensitive to it because the shadow
  # per leaf is conserved: 0.1, 0.15 and 0.2 m give the same light
  # distribution. VERIFY
  voxel_size: 0.10
  # Shadow of one leaf in its own voxel is a = k * A_leaf / voxel_size^2
  # (Beer-Lambert).  Measured in closed Betula pendula stands: K_PAR 0.37
  # (steep leaf angles, clumping index 0.42; Hagemeier & Leuschner 2019,
  # Forests 10:925, Table 5), not the 0.5 of a spherical leaf-angle
  # distribution.  With 0.5 the stand floor got 35 % light at LAI 2.2; the
  # same stands measured 14.8 % (6.4-19.8) at LAI 4.6 with the lowest leaves
  # at ~21 %.
  extinction_coefficient: 0.37
  # One-sided area of a silver-birch leaf (m^2): blades 3-7.5 cm long and
  # 1.5-6 cm wide (Flora of NSW; NC State Extension plant toolbox).  Current-
  # year birch shoots carry 167 cm2 of leaf on 27.9 cm of shoot [OP22]: at
  # 2.5 cm internodes (one leaf each) about 15 cm2 per leaf.
  leaf_area_m2: 0.0015
  # Sun and shade leaves.  Birch LMA rises with height in the crown,
  # LMA = 50.5 + 38.7 h^3.3 g m-2 (h relative height, adult trees in closed
  # stands; [HL19] Table 4), and its leaves are smallest in the uppermost sun
  # crown and grow larger with crown depth [HL19].  Here the leaf's relative
  # light q stands in for h.  Leaf size goes as (LMA_ref / LMA)^size exponent:
  # with exponent 1 every leaf has the same dry mass.  LMA_ref is the mean
  # shoot LMA of [OP22] (60.8 g m-2), where leaf_area_m2 above applies.
  # VERIFY (q for h; size exponent)
  sun_shade:
    enabled: true
    lma_shade_g_m2: 50.5
    lma_sun_increase_g_m2: 38.7
    lma_exponent: 3.3
    lma_reference_g_m2: 60.8
    size_lma_exponent: 1.0
  # Leaves stand off the node on a 1-2 cm petiole with a 3-7 cm blade, so a
  # bud's leaf area is spread over a Gaussian of this standard deviation (m)
  # around the node rather than piled into one voxel. VERIFY
  leaf_spread: 0.06
  # No shoot shades itself: the shade a shoot's own leaves (its axis with its
  # short shoots) cast on its buds is taken out of their light, for
  # photosynthesis, bud fate and leaf traits; their shade on every other
  # shoot stays.  false = only a bud's own leaves are taken out [P09].
  # Seed 1 at 60: carbon fixed +50 % open, +11 % stand.
  exclude_own_shoot: true
  # Shade is conserved going down apart from slow scattering (e-folding
  # length per metre of depth, m), so a closed canopy shades the crowns
  # below it as Beer-Lambert says.  It fades over shadow_horizontal_reach
  # (m) of sideways travel: low-angle shade from far away is broken up by
  # gaps, and this keeps the periodic wrap of the layer FFT off the crown.
  # The penumbra widens with variance penumbra_diffusion * path (m^2).
  # VERIFY
  shadow_decay_length: 30.0
  shadow_horizontal_reach: 6.0
  penumbra_diffusion: 0.11
  # Margin (m) that keeps the periodic wrap of the layer FFT off the crown.
  horizontal_margin: 8.0
  # Leaves that each bud state carries (shadow weight).  Current-year leaf at
  # every fresh node; birch short shoots bear 2-3 early leaves [CK66, M82];
  # older dormant buds are leafless.
  foliage_weight:
    new_leaf: 1.0
    spur: 2.5
    dormant: 0.0
  # Perception volume for the optimal growth direction V [P09]: probe
  # distance (m), cone half-angle, number of probe directions, soft-min
  # width (shadow units). VERIFY
  perception_radius: 0.5
  perception_cone_deg: 80
  perception_samples: 64
  perception_softmin: 0.05

shedding:
  # A lateral branch is shed when the leaf-weighted mean light exposure of
  # its buds falls below this, or it has no leaves left.  This is the Q/N
  # test of [P09 Sec. 4, step 4] with the cost counted per leaf instead of
  # per internode: at real internode resolution the bare inner wood of
  # healthy limbs pushed Q/N to within 20% of any fixed threshold, so limbs
  # were shed in waves.  Branches die when their own foliage falls below
  # compensation (Sprugel, Hinckley & Schaap 1991).  Set to the light at
  # which short shoots die. VERIFY
  light_per_leaf_threshold: 0.21
  # Branches younger than this are never shed. VERIFY
  min_branch_age: 2
  # A branch also dies when the carbon its own leaves fix (alpha x light x
  # stomatal opening, after the root share) no longer pays the upkeep of its
  # wood (maintenance_per_internode per internode; Sprugel, Hinckley &
  # Schaap 1991).  Death comes from light and carbon; ageing only lowers
  # vigour.  Seed 1 stand at 60: crown base 0.53 H (0.65 before), LAI 4.05
  # (2.95; measured 4.6 in Hagemeier & Leuschner 2019).
  carbon_balance: true

architecture:
  # Divergence angle on the vertical leader (spiral phyllotaxis). VERIFY
  phyllotaxis_orthotropic_deg: 137.5
  # Alternate, two-ranked buds on lateral shoots: Betula leaves are
  # alternate [A92]; distichous arrangement on plagiotropic shoots. VERIFY
  phyllotaxis_plagiotropic_deg: 180.0
  # Random scatter of distichous buds around the horizontal plane. VERIFY
  distichous_jitter_deg: 25
  # Insertion angle of a new lateral on its parent, by the new lateral's
  # order (1, 2, 3+).  First-order: the measured mean branch angle of silver
  # birch, 43.2 deg (range 15-80, SD 10.4; clonal plantation, Latvia,
  # Forests 9:52, 2018).  Higher orders VERIFY.
  branch_angle_deg: [43, 42, 48]
  # Long shoots of Betula are sympodial: the true terminal bud aborts and
  # the distal lateral bud continues the axis, deflecting it slightly each
  # year. VERIFY (angle)
  sympodial_deviation_deg: 8
  # The renewal shoot's deflection is a curvature over this first length of
  # the new shoot (m) instead of a kink at one node; fine twigs that add only
  # 2-3 internodes a year then bend gradually.  null = kink. VERIFY
  sympodial_bend_length_m: 0.1
  # Random perturbation of shoot direction per sqrt(metre) of growth (a
  # random walk, so independent of internode length). VERIFY
  direction_noise_per_sqrt_m: 0.126
  # Correlation length (m) of that noise along a shoot: the noise bends the
  # shoot as a smooth random curvature (same wander per metre) instead of
  # independent kinks at every internode, so twigs fall in arcs. null =
  # independent kinks. VERIFY
  direction_noise_correlation_m: 0.3

tropism:
  # Primary tropisms of elongating shoots: D' = D + xi*V + eta*T [P09 Sec.
  # 4.3], with xi and eta per metre of growth (multiplied by the internode
  # length each step) so they do not depend on resolution.
  # By branch order 0, 1, 2, 3+.
  # Phototropism xi (1/m). VERIFY
  phototropism_per_m: [0.8, 0.8, 1.2, 1.5]
  # Gravitropism eta (1/m): pull towards the set-point direction.  No
  # measured value for birch found.  Stem (and replacement leaders): 2/m, a
  # convergence length of ~0.5 m (defined by Bastien et al. 2013, PNAS
  # 110:755; no birch value).  Fitted on the natural plot against the 144
  # hand-traced birch stems (reference/stem_traces.json) on lean, max
  # off-line and total turning together, with the model's projected traces
  # clicked like the hand traces (clicks per trunk from the traces, scatter
  # 4.6 px = half the 0.5 %-of-height upper bound estimated from them): sum
  # of squared relative errors 0.81 / 0.14 / 0.20 / 0.41 at 1 / 2 / 3 / 4
  # per m (2 also best at 2.3 px; 4 at the 9.1 px upper bound).  At 4/m a
  # deflected leader was back on target within 0.25 m and the stem never
  # changed course (phase 16).  Height unchanged. VERIFY (fitted; other
  # orders unsourced)
  gravitropism_per_m: [2.0, 3.5, 2.0, 0.5]
  # The leader also turns towards the side of the crown that catches more
  # light (the light-weighted offset of the crown's leafy buds from the stem),
  # not only towards open sky at its apex, which is open in every direction
  # at the top of a stand.  Inside the crown the stem's posture target tilts
  # the same way, by phototropism over gravitropism (whole-tree phototropism,
  # Loehle 1986, Am. Midl. Nat. 116:190), so reaction wood straightens it
  # towards the light, not to vertical: seed 1 stand leans 1.2 deg (stand
  # photos 1-3 deg); with a vertical target 0.3 deg.
  stem_crown_phototropism: true
  # Gravitropic set-point angle from vertical (Digby & Firn 1995, Plant Cell
  # Environ. 18:1434), by order: the stem is vertical, birch main branches
  # ascend steeply [A92], higher orders spread.  Also the target of posture
  # control in the mechanics.  First-order limbs: the measured branch angle
  # (43 deg, as branch_angle_deg); the old 25 deg was chosen to hit a crown
  # width and kept limbs almost parallel to the stem (poplar-like).  Higher
  # orders VERIFY.
  setpoint_angle_deg: [0, 43, 45, 65]

mechanics:
  # Bending under load and posture control ([J00], [AF09]; mechanics.py).
  enabled: true
  # Fresh wood density (kg/m^3): silver-birch basic density ~0.5 g/cm^3 at
  # ~70-80 % moisture content. VERIFY
  wood_density: 850.0
  # Fresh mass of one leaf (kg): 12 cm^2 at ~70 g/m^2 dry mass and ~65 %
  # water. VERIFY
  leaf_mass: 0.0002
  # Bending stiffness of wood (Pa).  Small clear specimens of mature silver
  # birch: 14.5 GPa (Finnish data); green wood is lower. VERIFY
  youngs_modulus_wood: 1.0e+10
  # Stiffness of thin current-year shoots (Pa): mostly primary tissue; birch
  # shoots lose 2-2.5x stiffness when thawing (Russian shoot-bending study,
  # doi:10.1134/S1995425522070150). VERIFY
  youngs_modulus_shoot: 2.5e+9
  # Posture control: corrective curvature per year <= C * dr / r^2 [AF09],
  # C = 4 * (maturation-strain asymmetry of reaction wood, ~0.003). VERIFY
  reaction_wood_coefficient: 0.012
  # Posture control follows the sine law of gravitropism (Galland 2002,
  # Physiol. Plant. 115:481; Bastien et al. 2013, PNAS 110:755): the
  # correction scales with the sine of the deviation from the set-point.
  # false: full correction of any deviation, which kept every stem exactly
  # vertical.  The reaction-wood asymmetry saturates: full correction from
  # sine_law_saturation_deg on (a pure sine law left limbs sagging to 67 deg
  # from vertical against the measured 43). VERIFY (saturation angle)
  sine_law: true
  sine_law_saturation_deg: 10.0
  # The pendulous trait of silver birch [A92]: shoots thinner than this
  # radius (m) are soft and cannot correct their posture, so long thin
  # shoots hang under their own weight and the load they carry.  Stiffness
  # and correction are scaled by s(r) = (r/r_p)^p / (1 + (r/r_p)^p). VERIFY
  pendulous_radius: 0.006
  pendulous_sharpness: 4.0
  # The year's load increment is applied in sub-steps on the updated shape;
  # no internode turns more than this per sub-step (rad). Model guard.
  substeps: 4
  max_rotation_per_step: 0.25

pipe_model:
  # r_parent^g = sum r_child^g [S64].  Measured exponents for trees lie
  # between ~2 and 3; the brief asked for ~2.5. VERIFY
  exponent: 2.5
  # Radius of a current-year long-shoot tip (m): birch twigs ~2 mm thick.
  # VERIFY
  tip_radius: 0.001
  # Pipe added by each short shoot (m). VERIFY
  spur_radius: 0.0008
  # How radii grow: "pipe" recomputes them each year from the pipes to the
  # current foliage (plus disused pipes of shed branches); "rings" adds an
  # annual ring to every living internode whose area follows the leaf area
  # beyond it, so the increment is constant below the crown base (Pressler's
  # rule) and wood of shed branches stays (disused pipes [S64]); wood is never
  # thinner than the pipes it carries (without that floor ring-grown limbs
  # were ~40 % thinner than the pipe model's and bent down under their load).
  # "stem_rings" grows only the stem by rings and keeps the pipe model for
  # branches.
  growth: rings         # pipe | stem_rings | rings
  # Wood volume laid down per unit of shoot carbon (m3 per model carbon unit,
  # the resource that builds one metamer).  The model's carbon has no
  # published conversion; set when the carbon budget was smaller (open seed 1
  # keeping its pipe-model DBH); with the phase-7 budget it gives stand seed
  # 1 H/D 88 and DBH 30.6 cm at 60. VERIFY (calibrated)
  wood_volume_per_carbon: 1.2e-6
  # Stress floor (rings only): each year's ring is at least what keeps the
  # self-weight bending stress (wood and leaves beyond, about the internode's
  # base) at or below a safe limit, the uniform-stress hypothesis (Metzger
  # 1893; McMahon & Kronauer 1976).  Limit = green modulus of rupture /
  # safety factor.  Silver-birch MOR 114 MPa on small clear specimens
  # (Wood Sci. Technol. 37, doi 10.1007/s00226-003-0209-1; seasoned); green
  # wood about half of that (yellow birch 57 vs 114 MPa green vs 12 %
  # moisture, USDA Wood Handbook) -> 57 MPa. VERIFY (green value derived).
  # Branch breaking safety factor (MOR / actual bending stress, all loads)
  # above 3.5 and about constant along branches (Univ. Tokyo study,
  # repository.dl.itc.u-tokyo.ac.jp record 7675). VERIFY (other species).
  # The extra wood is not charged to the carbon budget.
  stress_floor:
    enabled: true
    wood_mor_green_mpa: 57.0
    safety_factor: 3.5

geometry:
  # Root flare.  "buttress": the stem base rises in ridges over the main
  # structural roots (mesh._buttresses): each ridge as wide and as high at the
  # ground line as its root is thick, fading upwards; the largest reaches the
  # uppermost root collar, whose height for birch is 0.4862 DBH[cm] +
  # 0.4979 H[m] cm (Laasasenaho 1982, Commun. Inst. For. Fenn. 108, as coded
  # in the forester R package; relative SE 44 %).  Ridge width and height
  # in proportion to root size are geometric assumptions. VERIFY
  # "bell" (also the fallback for meshes without roots): a uniform swelling,
  # radius gain at ground level and its decay height (m). VERIFY
  root_flare_mode: buttress
  root_collar_height_coef: [0.4862, 0.4979]
  root_flare_extra: 0.35
  root_flare_height: 0.45
  # Junction fillet radius as a fraction of the child radius. VERIFY
  junction_blend: 0.6
  # Branch collar: extra radius of a lateral where it leaves its parent and
  # the decay length of that swelling in child radii. VERIFY
  collar_extra: 0.35
  collar_length: 1.5

reference:
  # Used only by the stats checks, never by the growth model.
  height:
    # Hossfeld IV site-index model [E97]: H50 at breast-height age 50 (m).
    # 20-26 m spans medium to good Swedish birch sites; planted birch on
    # former farmland averages ~28 m (Karlsson et al. 1997).
    site_index_low: 20
    site_index_high: 26
    asi: 7
    beta: 394
    b2: 1.387
    # Years from germination to 1.3 m on a good site. VERIFY
    years_to_breast_height: 4
  crown:
    # Linear fit to the open-grown silver birch table of [H05]:
    # crown diameter (m) = 0.96 + 16.2 * dbh (m).
    intercept_m: 0.96
    slope_m_per_m: 16.2
  dbh:
    # Open-grown / crown-released silver birch reaches 40-50 cm in 60 years
    # (target trees, Forests 12(5):599, 2021); stand-grown trees at rotation
    # (50-60 yr) are ~25-30 cm [H10].  VERIFY
    open_grown_band_cm: [30, 50]
    band_age: 60

leader_damage:
  # Loss of the leader's last annual shoot.  Each season the highest leader
  # tip is tested against every event whose height range holds it; a hit
  # kills that shoot, and the uppermost replacement_leaders lateral buds or
  # young laterals within replacement_zone_m below the wound become
  # leaders (upright set-point and posture, the stem's vigour).
  #   Moose browsing: recent damage (apical leader browsed or trunk broken)
  #   on 16.8 +- 1.9 % of birch stems in one winter, young stands of mean
  #   height 1-4 m in southern Sweden at 0.6-0.9 moose per km2 (Bergqvist,
  #   Bergstrom & Wallgren 2014, Silva Fennica 48:1077).  Moose reach about
  #   3 m. VERIFY (reach).
  #   Late frost, snow and wind breakage of the top: no published yearly
  #   rates for birch found; not included.
  # On by default (Swedish young stands are browsed); stand seed 1-20 at 22
  # years: 20 % forked, 45 % crooked stems (published: 39-42 % with a stem
  # defect at 22, Viherae-Aarnio & Velling 2008, Silva Fennica 42(5)).
  enabled: true
  replacement_leaders: 2
  replacement_zone_m: 0.5
  events:
    - name: moose browsing
      min_height_m: 0.3
      max_height_m: 3.0
      probability_per_year: 0.168

plot:
  # A plot of independent trees (treegen/plot.py, tools/plot.py).  Trees
  # differ by seed, by germination year (natural regeneration on a clear
  # felling establishes over a few years; VERIFY) and by a heritable factor
  # on their carbon gain, lognormal with this SD (additive genetic CV of
  # growth in silver birch progeny trials is roughly 5-10 %; VERIFY).
  germination_years: [0, 1, 2, 3]
  germination_weights: [0.4, 0.3, 0.2, 0.1]
  vigour_sd: 0.06

regeneration:
  # Natural regeneration in a plot (treegen/regeneration.py; tools/plot.py
  # --regeneration).  Seeds shed in a year by a tree of 20 cm DBH: ~137,000
  # (Wytham Woods, UK, 2015, inverse modelling of seed traps) [Liu & Evans
  # 2021, Forests 12:929].  Seed crops vary several-fold between years [same;
  # Dahlgren Lidman et al. 2023]; a constant crop here.
  seeds_ref: 137000
  dbh_ref_m: 0.20
  # Seed output in proportion to basal area (DBH^2). VERIFY
  fecundity_exponent: 2.0
  # Age from which a tree sheds seed.  Grafts and seedlings in Finnish seed
  # orchards flower from 2-3 years; no figure found for stand-grown trees.
  # VERIFY
  maturity_years: 10
  # Mean dispersal distance 38 m in a closed stand (65 m in the open) [Liu &
  # Evans 2021]; a 2-D exponential kernel. VERIFY (kernel shape)
  dispersal_mean_m: 38.0
  # One-year silver-birch seedlings per seed sown, unfenced, in full light on
  # clear fellings in central and northern Sweden, September one year after
  # sowing [Dahlgren Lidman et al. 2023, New Forests 55:157, Table 5]: on bare
  # mineral soil median 18 % (0-179 %, 12 site-years on mesic and moist
  # sites); on undisturbed humus on mesic sites 0.3 % (mean of 6 site-years:
  # 0, 0, 0, 0, 0, 2 %).  They include germination and the first year's
  # losses (drought, seed predation, browsing).
  establishment_mineral: 0.18
  establishment_organic: 0.003
  # Ground grid cell (m); at most one recruit per cell and year: more than one
  # seedling per m2 adds little because birch seedlings outcompete each other
  # within a few years [Dahlgren Lidman et al. 2023].
  cell_m: 1.0
  # Exposed mineral soil: share of the ground at the start (the stand grows up
  # after a stand-replacing disturbance), share newly exposed each year
  # (uprooting, animals, frost heave) and half-life of its cover by moss and
  # litter.  Pit-mound microrelief from uprooting covers 7-12 % of the ground
  # in all-aged boreal forests [Samonil et al. 2010, Geoderma 157:65, review].
  # VERIFY (all three)
  mineral_initial: 0.3
  mineral_new_per_year: 0.005
  mineral_half_life_years: 5.0

stand:
  # --stand: neighbour trees as shadow volumes.  The light grid is one
  # periodic cell of a hexagonal stand lattice; every lattice point is a copy
  # of the focal crown turned by a fixed random angle, and the grid repeats,
  # so the focal tree is surrounded by neighbours in every direction with no
  # stand edge.  Trees across one cell (4 = 16 trees, two rings before the
  # pattern repeats).
  cell_trees: 4
  # In a closed stand nothing breaks up low-angle shade, so it does not fade
  # sideways (m).
  shadow_horizontal_reach: 1000.0
  # Nor does it fade on the way down below the canopy (the open-tree e-folding
  # length of 30 m let light recover towards the ground, and limbs from the
  # seedling years lived on at 0.2-1.5 m in a 60-year-old stand). null = as
  # light.shadow_decay_length.
  shadow_decay_length: 1000.0
  # Neighbour layout.  "lattice": the hexagonal lattice, every point a copy of
  # the focal crown turned by a random angle (symmetric light, dead straight
  # stems).  "random": cell_trees^2 trees at random positions in a square
  # periodic cell at the same stem density, no two closer than min_distance x
  # the mean spacing (thinned stands are more regular than random), each a
  # copy turned by a random angle and scaled by a fixed relative size (height
  # CV of even-aged stands about 0.1; VERIFY).
  layout: random
  min_distance: 0.6
  size_cv: 0.10
  # Stem density by top height, Swedish silver-birch practice [SS14]:
  # after pre-commercial thinning no more than 1500-2000 birches/ha by 6-7 m
  # height (p. 69-70); first thinning at 10-12 m top height to 800-1200/ha
  # (p. 88); next at 15-17 m, either one strong thinning to 400-500/ha or
  # 600-800/ha and a last one at ~20 m to just under 400/ha (p. 88).  The
  # dominant schemes are 2-3 strong, early thinnings ending at 300-400/ha
  # (p. 87; Hynynen et al. 2010: two thinnings, 389/ha).  Here: the strong
  # two-thinning programme, mid-range values.  The green crown is to stay
  # above 50 % of tree height (p. 87).  The neighbours are copies of the
  # focal crown, so they follow its height curve every year.
  thinning:
    - {from_height_m: 0.0, stems_per_ha: 1800}
    - {from_height_m: 11.0, stems_per_ha: 1000}
    - {from_height_m: 16.0, stems_per_ha: 450}

stats:
  # A first-order limb counts towards the crown base only if its subtree
  # carries at least this share of the tree's leaves.
  crown_base_min_leaf_share: 0.005
  # Hanging runs shorter than this (m) are not counted as hanging twigs.
  hanging_twig_min_length: 0.2

hydraulics:
  # Pipe-model water transport (hydraulics.py) [S64, K04].
  # Transpiration of a fully lit leaf at midday (kg m^-2 s^-1).  Branch sap
  # flow in the upper crown of silver birch averages 59 g m^-2 h^-1 over the
  # day (1.6e-5); midday is about twice that (PMC4602113 and Sellin et al.).
  # VERIFY
  transpiration_max: 3.0e-5
  # Xylem-specific conductivity of stem and branch wood (kg m^-1 s^-1
  # MPa^-1).  Diffuse-porous broadleaves 1-5; birch has the highest whole-
  # plant and shoot conductance among temperate saplings compared.  At 2.0
  # the top leaves of a well-watered tree reached -2.0 MPa, at the branch
  # P50 (-1.8 to -2.0 MPa [K18]; PMC6025199) and where birch only goes in
  # severe drought (-1.9 to -2.1 MPa; well-watered -1.0 to -1.3, Sellin et
  # al., PMC3976162); doubled within the published range. VERIFY
  xylem_conductivity: 4.0
  # Xylem area per unit leaf area served (Huber value, m2 m-2): 1.24e-4 at
  # the base of current-year birch shoots ([OP22] Table 1; xylem
  # cross-section over the shoot's leaf area).  Conducting area is then
  # counted as the pipe model's additive pipes, so it stays about constant
  # down the path, as measured in birch crowns (Sellin & Kupper 2006, Trees
  # 20:311: HV even rises towards the base).  null = the visible-wood pipes
  # merged with the branching exponent, which made it 4x too high at the
  # shoots and fall towards the stem.
  huber_value: 1.24e-4
  # Vessels widen from twig tips towards the stem base (Anfodillo et al.
  # 2006, Tree Physiol. 26:1415; Olson et al. 2014, Ecol. Lett. 17:988), and
  # conductivity goes with vessel diameter squared, so thin wood conducts
  # worse: k_s(r) = xylem_conductivity * min(1, (r / reference)^exponent).
  # This is what makes long runs of thin branches expensive. VERIFY
  conductivity_reference_radius: 0.02
  conductivity_exponent: 0.7
  # Root wood conducts better than stem wood (wider vessels). VERIFY
  root_xylem_conductivity: 4.0
  # Stomata start closing at psi_stomata_open and are shut at
  # psi_stomata_closed (MPa); silver birch is drought-sensitive and
  # cavitation-prone. VERIFY
  psi_stomata_open: -1.0
  psi_stomata_closed: -2.0
  # Expansion is full above psi_full_expansion and stops at the turgor-loss
  # point (MPa) [K04]. VERIFY
  psi_full_expansion: -0.9
  psi_turgor_loss: -2.1
  # Which water potential drives expansion: "predawn" (soil water potential
  # minus the gravitational gradient, 0.0098 MPa/m: shoots and leaves expand
  # mostly at night and early morning, after the tree has rehydrated) or
  # "midday" (the transpiring potential, which also closes the stomata).
  expansion_water_potential: predawn

roots:
  # Root growth (roots.py): bud competition for soil water.
  # Structural root segment (m); fine roots are represented by the uptake of
  # young segments, not drawn. VERIFY
  segment_length: 0.05
  # Longest annual extension of a root tip (m). VERIFY
  max_extension_per_year: 0.8
  # Radicle of the germinating seed, in segments.
  radicle_segments: 2
  # Root tip radius (m) for the pipe model. VERIFY
  tip_radius: 0.001
  # Roots never come closer to the surface than this (m).
  min_depth: 0.02
  # Silver birch has no lasting taproot: the seedling's vertical tap root
  # turns horizontal after ~30 cm or is overtaken by side roots [L35]; its
  # pull fades with this time constant (years). VERIFY
  taproot_fade_years: 4
  # ... and stops at this depth (m), so the main laterals leave from the
  # root collar zone. VERIFY
  taproot_max_depth: 0.4
  # Gravitropic set-points (deg from vertical-up; 180 = straight down) and
  # strengths (1/m).  Main laterals run nearly horizontally in the top soil,
  # most root length lies in the top 20-30 cm (76 % of fine roots in the
  # top 20 cm in a young Estonian birch stand; ~45/37/18 % in 0-10/10-20/
  # 20-30 cm in a Swedish B. pendula plantation). VERIFY
  taproot_setpoint_deg: 180
  taproot_gravitropism_per_m: 3.0
  lateral_setpoint_deg: 97
  lateral_setpoint_spread_deg: 4
  lateral_gravitropism_per_m: 1.5
  # Sinker roots drop from main laterals near the stem to the compact
  # subsoil; birch root plates are ~0.9 m deep at the centre (31 trees,
  # Finnish re-measurement of [L35]). VERIFY
  sinker_setpoint_deg: 180
  sinker_gravitropism_per_m: 4.0
  sinker_probability: 0.06
  sinker_zone_radius: 1.5
  # Hydrotropism towards the wettest nearby soil (1/m) and random wander
  # (1/sqrt m). VERIFY
  hydrotropism_per_m: 0.8
  direction_noise_per_sqrt_m: 0.25
  probe_radius: 0.15
  # Lateral roots leave their parent at this angle (deg). VERIFY
  branch_angle_deg: 70
  # Borchert-Honda split for roots, as for shoots. VERIFY
  apical_dominance: 0.7
  apical_control: 0.55
  primordium_weight: 0.5
  # A primordium forms a lateral root with at least this many segments of
  # resource, and dies unused after this many years. VERIFY
  lateral_threshold: 3.0
  primordium_lifespan: 2
  # The root collar (the taproot zone): a birch seedling forms its main
  # laterals from the upper taproot in the first years and they radiate
  # evenly around the stem [L35].  Collar primordia need less to break, stay
  # viable longer, sit at a fixed divergence around the taproot (lateral
  # roots form opposite the xylem poles), and share the budget along the
  # taproot without favouring the deeper ones. VERIFY
  collar_primordium_weight: 1.0
  collar_lateral_threshold: 1.0
  collar_primordium_lifespan: 10
  collar_divergence_deg: 137.5
  collar_apical_control: 0.5
  # Water draw-down: availability falls as exp(-k * RLD) with the tree's own
  # absorbing root length density RLD (m/m^3), blurred over the depletion
  # radius (m) around each root. VERIFY
  depletion_coefficient: 0.004
  depletion_radius: 0.12
  # Roots younger than this (years) carry the fine-root cloud that takes up
  # water. VERIFY
  absorbing_years: 3
  # Uptake conductance per metre of absorbing structural root in fully
  # available soil (kg s^-1 MPa^-1 m^-1).  Calibrated against 5-year-old
  # silver birch saplings (Sellin et al., Tree Physiol., PMC3976162):
  # soil-to-branch conductance 2.28 mmol m-2 s-1 MPa-1 of leaf area; at
  # 1e-5 the model's roots alone gave 1.4 and took 85-93 % of the sapling's
  # water-potential drop. VERIFY (calibrated)
  uptake_conductance_per_m: 2.0e-5
  # Tips die where availability drops below this; a lateral root is shed
  # when the mean availability at its tips and primordia does. VERIFY
  tip_survival_availability: 0.08
  shed_availability: 0.1
  # Margin of the soil grid around the roots (m).
  field_margin: 0.5
  # Zone of rapid taper: near the stem, structural roots carry extra wood
  # for anchorage and thin fast; beyond it they follow their own pipe model.
  # The zone reaches 2.2 x DBH from the stem [D05, Pinus pinaster]; the
  # extra wood fades exponentially with distance, with a length of this
  # fraction of the zone radius (13 % left at the zone edge, ~2 % at twice
  # that). VERIFY for birch
  zrt_radius_per_dbh: 2.2
  zrt_fade_fraction: 0.5
  # Near the collar growing roots keep clear of the stem column and of other
  # roots (root-stem and root-root avoidance): a push away from any root
  # closer than both radii plus the clearance (m), within this distance of
  # the stem (m).  null = off. VERIFY
  avoid_clearance_m: 0.03
  avoid_zone_radius_m: 1.5
  avoid_weight: 1.5
  # A growing root turns by at most this much per segment (deg), so
  # avoidance and tropisms bend it smoothly; stones can still deflect it
  # sharply. null = no limit. VERIFY
  max_turn_deg_per_segment: 30
  # The seedling taproot decays below the deepest living main lateral once
  # it has stopped [L35]. VERIFY
  trim_taproot: true

anchorage:
  # Root-soil plate and root strength for later storm modelling (numbers
  # only).  The plate is the zone of rapid taper: each main root counts up
  # to where it thins below this diameter (m). VERIFY
  plate_root_diameter: 0.02
  # The plate radius comes from the main structural roots: the fewest main
  # roots that carry this share of the base cross-section of all main roots,
  # weighted by cross-section. VERIFY
  plate_structural_share: 0.8
  # Plate radius rule: "taper_zone_end" (where the extra wood of the zone of
  # rapid taper has faded to 5 % along each structural root, weighted by
  # cross-section), "structural_roots_2cm" (where they thin below
  # plate_root_diameter) or "median_all_main_roots_2cm". VERIFY
  plate_radius_rule: taper_zone_end
  # Root tensile strength sigma = sigma_1mm * (d / 1 mm)^-beta (MPa): the
  # power law used for broadleaf roots (Bischetti et al. 2005, Plant Soil
  # 278:11; values for birch not published, broadleaf band). VERIFY
  tensile_strength_1mm_mpa: 30.0
  tensile_strength_exponent: 0.6
  # Windward roots slip and break progressively, so only part of their
  # breaking strength is mobilised when the plate turns over; root tension
  # is about half of anchorage in pulling tests [C86]. VERIFY
  root_strength_mobilised: 0.25
  # Empirical cross-check: tree-pulling resistance grows with H * DBH^2 for
  # uprooting [P00]; [P00] gives no birch coefficient in its abstract.
  # Silver birch pulled to uprooting in Latvia [K22, Tables 1-2], site means:
  # DBH 25.5 cm, H 29.1 m, 46.9 kN m (25 kN m/m^3); DBH 35.0 cm, H 32.8 m,
  # 154.3 kN m (38 kN m/m^3).  Mean of the two sites (computed from site
  # means, not tree-level data). ESTIMATE from [K22]
  h_dbh2_coefficient_knm_per_m3: 31.0
  h_dbh2_coefficient_range: [25.0, 38.0]
  # Critical turning moment, ForestGALES-style: an empirical regression of
  # tree-pulling moments on stem size, M = C_reg x stem volume.  Silver birch
  # pulled to uprooting [K22, Tables 1-2], site means: V 0.67 m3, 46.9 kN m;
  # V 1.43 m3, 154.3 kN m; least squares through the origin gives
  # C_reg = 101 kN m per m3 of stem.  Adjusted for the simulated rooting
  # depth (deepest root within rooting_depth_radius_m, capped by the soil)
  # against the uprooted plates of [K22] (0.84-0.85 m deep), and, by wind
  # direction, for root asymmetry: root_tension_share of the moment comes
  # from windward root tension, about half in pulling tests [C86]. VERIFY
  # (depth factor limits)
  critical_moment_per_stem_volume_knm_per_m3: 101.0
  rooting_depth_radius_m: 1.5
  reference_rooting_depth_m: 0.85
  depth_factor_min: 0.5
  depth_factor_max: 1.2
  root_tension_share: 0.5

# Open field in east-central Sweden (Uppsala).  Light only; no neighbours.
type: sky_sun

site:
  # Uppsala, 59.86 N.
  latitude_deg: 59.86

season:
  # Birch leaf-out to leaf fall in central Sweden, roughly 10 May - 30 Sep.
  # VERIFY
  start_doy: 130
  end_doy: 273

radiation:
  # Diffuse share of global radiation over the growing season; Swedish
  # stations report roughly 0.4-0.55 (SMHI). VERIFY
  diffuse_fraction: 0.5
  # Exposure Q of an unshaded bud [Palubicki et al. 2009, C].
  full_light: 1.0

sky:
  # CIE standard overcast sky (Moon & Spencer 1942): L ~ (1 + 2 sin e) / 3.
  model: cie_overcast
  # Sample elevations (deg) and the azimuth count of the lowest band.
  elevations_deg: [8, 22, 38, 55, 72, 88]
  azimuth_count: 12

sun:
  # Sun-path sampling over the season; collapsed to one direction per hour.
  day_step: 7
  hour_step: 1.0
  # Very low sun is blocked by the horizon / surrounding vegetation. VERIFY
  min_elevation_deg: 5
  # Clear-sky beam transmittance per air mass. VERIFY
  atmospheric_transmittance: 0.7

soil:
  # Podzolised sandy-loam till, the commonest forest soil of central Sweden.
  # Depth (m) to the compact basal till / bedrock that roots rarely enter:
  # mean, spread and correlation length of a smooth random field, clipped.
  # Uprooted birch root plates are 0.84-0.85 m deep on Latvian mineral soils
  # [Krisans et al. 2022, Forests 13:127] and ~0.9 m in Finland (31 trees,
  # re-measurement of Laitakari 1935); till depth to the compact layer varies
  # over a few metres with boulders and hollows. VERIFY
  depth_m: 1.2
  depth_sd_m: 0.3
  depth_correlation_m: 4.0
  depth_min_m: 0.6
  depth_max_m: 2.0
  # Plant-available water relative to field capacity, by depth below ground
  # (m, 0..1): the humus and E horizon dry out in summer, the B horizon holds
  # water, the compact till below holds less.  Shape only. VERIFY
  moisture_profile: [[0.0, 0.55], [0.08, 1.0], [0.35, 0.9], [0.7, 0.55], [1.2, 0.35]]
  # Volume share of stones and boulders by depth (m, 0..1); Swedish tills
  # are stony and get stonier with depth (Swedish Forest Soil Inventory
  # reports ~20-40 % stones in tills). VERIFY
  stone_profile: [[0.0, 0.08], [0.3, 0.15], [1.2, 0.30]]
  # Edge of one stone cell (m). VERIFY
  stone_size_m: 0.15
  # Bulk density of the root-soil plate (kg/m^3, moist mineral soil with
  # stones). VERIFY
  bulk_density: 1500.0
  # Soil water potential of moist soil in summer (MPa). VERIFY
  water_potential_mpa: -0.05

ground_vegetation:
  # The herb / field layer (grasses, herbs, dwarf shrubs) shades foliage
  # near the ground: light falls through it as exp(-k * leaf area above),
  # with its leaf area spread evenly over its height (Monsi & Saeki 1953,
  # transl. Ann. Bot. 95:549, 2005: herb communities LAI 4-7, extinction
  # coefficients of grass-like canopies ~0.3-0.5).  An unmown field on
  # Swedish forest land: lower LAI. VERIFY (height, LAI)
  enabled: false
  height_m: 0.6
  leaf_area_index: 3.0
  extinction: 0.4

# Where each value in species/betula_pendula.yaml came from.
#
#   sourced  a source gives it for this species; checked: page if someone read the page and it supports the value
#   TUNED    no direct source; set against what 'against' says
#   VERIFY   neither yet: estimated, borrowed from elsewhere, or unchecked
#
# 'value' is the value when labelled: if the species file's value differs, tools/species_report.py counts it

  seedling_root_shoot_ratio:
    age_1_to_3_years: [0.25, 0.50]
    root_dry_mass_share: [0.20, 0.35]
    source: "Konôpka et al. (2023, Plants 12:1607); Laitakari (1935, Acta For. Fenn. 41)"
    doi: "10.3390/plants12081607"
    # Q31 (the maintainer, 2026-11-09): kept. Konopka et al. 2023 print no root:shoot ratio, no ages 1-3 and no 0.4-1.5 m band; the band is worked out from the paper's biomass equations, and a recomputation falls inside it (final check (a), 2026-11-08).
    measures: "Ratio of belowground root dry mass to aboveground shoot dry mass in juvenile silver birch (height 0.4-1.5 m). Worked out from Konopka et al. 2023's equations, not printed there."
    kind: "by design"
    kind_reason: "partly by design, not independent (independent check of V1, 2026-11-11): treegen/growth.py:921 sets the share of carbon sent to the roots to resource.root_share_min + (resource.root_share_max - resource.root_share_min) x water stress, so with no stress 25 % goes below ground, inside this target's root share band of 0.20-0.35; the species file's comment on root_share_min says it was chosen from 'birch allocates about 25-40 % of production below ground'. How much of the dry-mass ratio the input fixes is not tested (no seedling run is saved, and the scorecard computes no value for this row yet: NOT SCORED). It stays by design until a seedling test shows the ratio does not follow the input. Crown fix C was tuned against Konopka 2023's leaf area for height, a different figure from the same paper"
    values_set: [resource.root_share_min, resource.root_share_max]
    tied_to: []
    stands: "not stated"
    band_basis: "worked out, not printed"
    source_opened: "Konopka et al. 2023 at the publisher, final check (a), 2026-11-08 (Q31): the band is worked out from its equations, not printed"
    matched: false
    match_note: "whether the paper's trees were natural or planted, and their site, isn't recorded here"
    conditions:
      scenario: [single-seedling]
      age_years: [1, 3]
      text: "Juvenile silver birch, height 0.4-1.5 m."

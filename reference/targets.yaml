# Acceptance targets for silver birch (Betula pendula) growth model benchmarks.
# Every figure quoted as a target in reports and comparison tools must originate here.
#
# Conditions are labels that tools/scorecard.py checks against the saved run
# output.  A label left out puts no limit on that condition.
#   scenario: list of  plot          tools/plot.py (plot.json)
#                      stand-tree    cli.py --stand (stats.json, mode "stand")
#                      single-tree   cli.py without --stand (stats.json, mode "open")
#                      single-seedling   a seedling run
#   mode:     list of  natural | managed | open-grown
#             (plot: as saved in plot.json; stand-tree runs follow the thinning
#             programme, so they are managed; single-tree runs are open-grown)
#   age_years: [lo, hi]   stand age (plot), tree age (single runs), years
#   density_stems_ha: [lo, hi]
#   options_required: {species option: value} that must have been on in the run
#   text: the source's own description of where it applies (not checked)
# scoring: info  ->  information only: the model value is shown next to the
#   target as INFO, never PASS/FAIL (the source gives no range or spread).
#
# Kinds (DECISIONS 110, items 4 and 12; reports/design/2026-11-11_validation.md section 5 with its
# challenge).  Every target says which kind it is; tools/scorecard.py prints each kind in its own block.
#   kind: by design      the model follows this figure (a curve it is driven by, a cap, an input), so
#                        being inside it shows the machinery holds, nothing more
#         tuned against  a species value was set with this figure on the table (values_set names them)
#         seen           the figure was watched while a value was chosen, without being the aim
#         out of sample  the quantity was tuned against other stands; this source is a new stand
#         independent    no species value was ever set, chosen or kept with this figure, nor with a
#                        figure tied to it by a formula in the model (tied_to)
#   kind_reason   why, with the place it is written
#   values_set    species values set or chosen with this figure in view
#   tied_to       targets whose figure the model ties to this one by a formula (light and leaf area
#                 through k; stems, diameter and basal area)
#   stands        how many stands stand behind the figure
#   band_basis    what the band rests on: three or more stands | published SD between stands |
#                 equation's between-stand spread | one or two stands | a guideline | an equation, no
#                 band | a model input | worked out, not printed | not stated
#   source_opened where and when the page was read at an allowed place, as text with the date
#                 (YYYY-MM-DD); false if not opened.  True or text with no date does not meet part 2
#   matched       true when species, natural or planted, density and site agree with the runs the
#                 conditions allow; match_note says how they differ
# Only an independent row can print PASS, and only when the seven-part rule holds (tools/scorecard.py,
# pass_rule).  The kind fields change no band, number or condition.

stand_canopy:
  lai_baltic_chronosequence:
    # The band's source, found 2026-11-09 (Q30): Varik, Aosaar & Uri 2009 print LAI 3.2, 4.4 and 2.5 for three natural stands aged 14, 32 and 45 (abstract: "ranged 2.5-4.4"), read at the publisher (reference-global.com, open access). The band's top of 4.5 rounds their 4.4 up. Uri 2012 (read as reprinted in Varik's thesis, Estonian University of Life Sciences) prints no LAI: its Table 1 (p. 119) is stand data for eight stands aged 6-60, Table 4 (p. 121) gives leaf mass; only one of those stands is on abandoned farmland. Varik 2015 prints none either. The age and density labels below are older than this and wider than the source; the maintainer kept the band (Q30, 2026-11-09).
    target_range: [2.5, 4.5]
    source: "Varik, Aosaar & Uri (2009); Uri et al. (2012) for the chronosequence"
    doi: "10.2478/v10132-011-0073-y"
    citation: "Varik, M., Aosaar, J., & Uri, V. (2009). Biomass production and carbon accumulation in silver birch stands in Oxalis site type. Forestry Studies / Metsanduslikud Uurimused 51:5-16. Also: Uri, V., et al. (2012). Biomass production and carbon sequestration in a fertile silver birch (Betula pendula Roth) forest chronosequence. Forest Ecology and Management 267:117-126, doi:10.1016/j.foreco.2011.11.033 (no LAI printed)."
    page_table: "Varik et al. 2009: abstract (p. 5) and Results, LAI 3.2, 4.4 and 2.5 at 14, 32 and 45 years; Table 1, stand data. Uri et al. 2012: Table 1 (p. 119) & Table 4 (p. 121), stand data and leaf mass only"
    measures: "Leaf area index (LAI, m2 m-2) of three natural silver birch stands on fertile forest land (Oxalis site type), southern Estonia, aged 14, 32 and 45 (1350, 3208 and 941 stems/ha): 3.2, 4.4 and 2.5, from the model trees' leaf area scaled by DBH, August 2008 (Varik et al. 2009). Not abandoned farmland, and not measured at 6-13 or 46-60."
    kind: "tuned against"
    kind_reason: "pipe_model.stem_theory.wind_speed_m_s was set against Dg, stems/ha and LAI on plots (labels.yaml; species file at the value); LAI and light are tied through the extinction coefficient"
    values_set: [pipe_model.stem_theory.wind_speed_m_s]
    tied_to: [stand_canopy.lai_hagemeier, stand_canopy.subcanopy_light_transmittance]
    stands: 3
    band_basis: "three or more stands"
    conditions:
      scenario: [plot]
      mode: [natural]
      age_years: [6, 60]
      density_stems_ha: [305, 100000]
      age_definition: "total age from establishment"
      text: "natural stands on fertile forest land (Oxalis site type), southern Estonia, LAI measured at 14-45 years (Varik et al. 2009)"

  lai_hagemeier:
    target_mean: 4.5 # mean of the two stands this source lists, 3.6 and 5.4; it prints no mean. Forests 10:925 Table 5 prints 4.6 for the same stands (reports/hagemeier2019b_publisher_reading.md). Not used in scoring
    stand_range: [3.6, 5.4]
    source: "Hagemeier & Leuschner (2019)"
    doi: "10.3390/f10030265"
    citation: "Hagemeier, M., & Leuschner, C. (2019). Functional Crown Architecture of Five Temperate Broadleaf Tree Species: Vertical Gradients in Leaf Morphology, Leaf Angle, and Leaf Area Density. Forests 10(3):265."
    page_table: "Section 3.2 (p. 9): 'leaf area index increased from Betula (3.6 and 5.4)'; Figure 7 (p. 11)"
    measures: "Stand leaf area index (LAI, m2 m-2) measured using circular litter collection buckets over two consecutive autumns (1998 and 1999)."
    source_stands: "Two birch stands (Table 3): site 1 aged 45 yr, 880 stems/ha; site 2 aged 67 yr, 420 stems/ha. Lehrer Wald and Lappwald, Helmstedt county, Lower Saxony, Germany (Table 2). Management is not stated in the paper."
    kind: "tuned against"
    kind_reason: "pipe_model.stem_theory.wind_speed_m_s was set against LAI on plots; the extinction coefficient 0.37 (light.extinction_coefficient) comes from the same two stands (Forests 10:925 Table 5)"
    values_set: [pipe_model.stem_theory.wind_speed_m_s]
    tied_to: [stand_canopy.lai_baltic_chronosequence, stand_canopy.subcanopy_light_transmittance]
    stands: 2
    band_basis: "one or two stands"
    conditions:
      scenario: [plot, stand-tree]
      age_years: [45, 67]
      age_definition: "stand total age"
      text: "mature monospecific Betula pendula stands"

  subcanopy_light_transmittance:
    target_median_pct: 14.8
    target_range_pct: [6.4, 19.8]
    source: "Hagemeier & Leuschner (2019b)"
    doi: "10.3390/f10100925"
    citation: "Hagemeier, M., & Leuschner, C. (2019). Leaf and Crown Optical Properties of Five Early-, Mid- and Late-Successional Temperate Tree Species and Their Relation to Sapling Light Demand. Forests 10(10):925."
    page_table: "Results 3.2 and Figure 5 (14.8%, 6.4-19.8%); Table 5 (K_PAR, clumping); Methods 2.3. Read from the publisher's HTML, which has no page numbers (reports/hagemeier2019b_publisher_reading.md); check the table values against the PDF when saved"
    measures: "Relative diffuse photosynthetically active radiation (PAR) transmittance (T_PAR, %) reaching the forest floor beneath closed mature birch canopy: overcast days, 11:00-14:00, 110-241 points per stand, forest-floor sensor on a 2 m pole, its height above the ground not stated. \"A median transmission of 14.8% was recorded in the B. pendula stands, with individual values varying between 6.4% and 19.8%.\""
    optical_parameters:
      k_par: 0.37 # canopy extinction coefficient for PAR under diffuse light
      foliage_clumping_index: 0.41 # Omega; Results text 0.41, Table 5 0.42
    kind: "tuned against"
    kind_reason: "three labelled values (bud_fate.short_shoot_light, bud_fate.short_shoot_survival_light, shedding.light_per_leaf_threshold) say TUNED against light under the canopy; shedding.shade_softness and crown_frame.spacing_overlap say TUNED against light and leaf area in the species file"
    values_set: [bud_fate.short_shoot_light, bud_fate.short_shoot_survival_light, shedding.light_per_leaf_threshold, shedding.shade_softness, crown_frame.spacing_overlap]
    tied_to: [stand_canopy.lai_baltic_chronosequence, stand_canopy.lai_hagemeier]
    stands: 2
    band_basis: "one or two stands"
    conditions:
      scenario: [plot, stand-tree]
      age_years: [45, 67]
      text: "mature stands with a closed canopy (canopy closure > 0.9, Forests 10:265 p. 3), aged 45 and 67 (Table 3 there; Table 2 of Forests 10:925)."

  live_crown_ratio:
    silvicultural_recommendation:
      min_ratio: 0.50
      source: "Hynynen et al. (2010)"
      doi: "10.1093/forestry/cpp035"
      citation: "Hynynen, J., et al. (2010). Silviculture of birch (Betula pendula Roth and Betula pubescens Ehrh.) in northern Europe. Forestry 83(1):103-119."
      page_table: "Section 'Thinning and pruning' (p. 109, column 2)"
      measures: "Minimum live crown ratio (LCR = crown length / total height) required for crop trees in commercial birch stands."
      scoring: info # a silvicultural recommendation, not a measurement (the maintainer, 2026-11-02)
      kind: "seen"
      kind_reason: "a guideline, not a measurement; crown length was set by eye and against crown ratio (bud_fate.density_control.af_zero, crown_frame.profile_power) with this 0.50 and Repola's 0.58 in the reports. That this row in particular was watched is SUSPECTED, not traced"
      values_set: [bud_fate.density_control.af_zero, crown_frame.profile_power]
      tied_to: [stand_canopy.live_crown_ratio.managed_stand_empirical]
      stands: "none: a guideline"
      band_basis: "a guideline"
      conditions:
        scenario: [plot, stand-tree]
        mode: [managed]
        text: "Managed stands; silvicultural guideline prescribing early pre-commercial thinning (PCT at dominant height 5-7 m) and commercial thinning to prevent crown recession below 0.50 and maintain rapid stem diameter growth."
    managed_stand_empirical:
      mean_ratio: 0.58
      range: [0.29, 0.96]
      std: 0.14
      source: "Repola (2008)"
      doi: "10.14214/sf.236"
      citation: "Repola, J. (2008). Biomass equations for birch in Finland. Silva Fennica 42(4):605-624."
      page_table: "Table 2 (p. 608)"
      # The key's name says "managed", but most of Repola's stands were naturally regenerated and mixed, about a third of the birch B. pubescens (final check (a), 2026-11-08); natural added to mode (Q35, the maintainer, 2026-11-09). The name stays: tools/tree_table.py reads it.
      measures: "Live crown ratio of 127 sample trees from 24 stands across Finland (mean DBH 16.5 cm, mean H 17.1 m), most of them naturally regenerated and mixed with B. pubescens. Unthinned and heavily thinned plots are included (p. 608), and three stands were on peatlands (p. 607)."
      scoring: info # the range is the spread of single sample trees, not of stand means; stand age 11-97 years (Table 1)
      kind: "seen"
      kind_reason: "quoted beside crown fix C when it was adopted (DECISIONS 107: crown ratio at 18 m 0.521 against Repola 0.58 +/- 0.14); crown_frame.twig_bud_every was set against crown ratio and stem wood (species file), though today's defaults don't read it"
      values_set: [crown_frame.chase, crown_frame.limb_shoot_floor_m, crown_frame.twig_bud_every]
      tied_to: []
      stands: 24
      band_basis: "not stated" # the range is the spread of 127 single sample trees, not of stands
      conditions:
        scenario: [plot, stand-tree]
        mode: [natural, managed]
        text: "24 stands across Finland, natural and managed, mostly naturally regenerated and mixed with B. pubescens; unthinned and heavily thinned plots included"
    dense_unmanaged_stand:
      target_range: [0.30, 0.45]
      source: "Niemistö (1995, Paper 1); Repola (2008)"
      doi: "10.1080/02827589509382889"
      citation: "Niemistö, P. (1995). Influence of initial spacing and row-to-row distance on the crown and branch properties and taper of silver birch (Betula pendula). Scand. J. For. Res. 10:235-244."
      page_table: "Table 2 (p. 238) & Fig. 1 (p. 239); Repola (2008) Table 2 minimum (0.29)"
      measures: "Observed live crown ratio in dense, self-thinned stands. In Niemistö (1995) dense unthinned planted trials (3,000-5,000 stems/ha, aged 11-22 yr), rapid crown lift reduced LCR to 0.35-0.45, with suppressed trees reaching 0.30. Repola (2008) Table 2: 0.29 is the minimum across all sample trees. Niemistö (1995) has not been opened in this campaign: the numbers here are unchecked."
      kind: "seen"
      kind_reason: "candidate values were judged against this band and kept off: four arms (shedding.limb_light_line 0.21 and 0.30, shedding.limb_relative_light 0.6, shedding.limb_carbon_margin 1.5) scored on crown ratio at 11, 15, 20 and 22 against 0.30-0.45, nothing adopted, the switches left off (reports/overnight_log.md, young crowns rounds 1 and 2); option J and a light change judged on crown ratio at 22 against it, J kept off (same log, 06:50). Crown fix C (crown_frame.chase, crown_frame.limb_shoot_floor_m) was tuned against Konopka 2023's young leaf area for height and then compared on crown ratio by stand height (0.58 at 15 m; KNOWN_ISSUES.md, Young crown ratio: tuned after v1). No value in use was set to hit this band, so seen, not tuned; never independent"
      values_set: [shedding.limb_light_line, shedding.limb_relative_light, shedding.limb_carbon_margin, crown_frame.chase, crown_frame.limb_shoot_floor_m]
      tied_to: []
      stands: "not stated: Niemisto's trials, source unopened"
      band_basis: "not stated"
      source_opened: false
      matched: false
      match_note: "the source's trials were planted at 3,000-5,000 stems/ha; the plots are natural, from 16,000/ha"
      conditions:
        scenario: [plot]
        mode: [natural]
        age_years: [11, 22]
        text: "Dense unmanaged natural stands subject to dense lateral shading and natural self-pruning. Applicable specifically to young dense stands (ages 11-22 yr); NOT a target for mature stands (ages 50-60)."

  stand_density:
    stems_per_ha_45yr: 880
    stems_per_ha_67yr: 420
    source: "Hagemeier & Leuschner (2019, Forests 10(3):265)"
    doi: "10.3390/f10030265"
    page_table: "Table 3 (Betula pendula sites 1 and 2)"
    measures: "Stem density of one birch stand at each age. Table 3, B. pendula: site 1, 45 yr, 880 stems/ha (85 % of stems birch, mean height 20 +- 3 m, mean dbh 19 +- 6 cm); site 2, 67 yr, 420 stems/ha (98 %, 25 +- 3 m, 25 +- 3 cm)."
    scoring: info # one stand per age; Table 3 gives no range or spread for stem density
    kind: "tuned against"
    kind_reason: "pipe_model.stem_theory.wind_speed_m_s was set against stems/ha on plots; mortality.shape holds a stand losing 3 % a year near Hagemeier (labels.yaml); 846 against 880 at 45 was quoted when crown fix C was adopted (DECISIONS 107)"
    values_set: [pipe_model.stem_theory.wind_speed_m_s, mortality.shape]
    tied_to: []
    stands: "1 per age"
    band_basis: "one or two stands"
    conditions:
      scenario: [plot]
      text: "Closed-canopy (> 0.9) birch stands on loamy sand, Helmstedt county, Lower Saxony, Germany (Tables 2-3). The paper does not state whether the stands were managed or self-thinned."

  dominant_height_invariance:
    rule: "Dominant height (mean height of the 100 largest trees/ha) is invariant to stand density (400-3,100 stems/ha) during the juvenile phase (ages 2-15) and normal forestry stocking (1,000-2,500 stems/ha) across the rotation."
    source: "Niemistö (1995, Scand. J. For. Res. 10:245-255); Hynynen et al. (2010, Forestry 83:103)"
    doi: "10.1080/02827589509382890"
    scoring: info # a rule across several runs, not a single value
    kind: "by design"
    kind_reason: "the height driver grows the leader to the site-index curve at any density (height_driver.enabled, on by default)"
    values_set: []
    tied_to: [tree_allometry.site_index_curves]
    stands: "a rule"
    band_basis: "a guideline"
    conditions:
      scenario: [plot]
      text: "Holds across typical plantation and clearcut spacings. Stagnation occurs only in extremely dense unthinned stands (>3,500 stems/ha) after dominant height exceeds 15 m; minor height reduction occurs at very low density (<400 stems/ha) due to heavy branch allocation."

  clear_stem_at_first_thinning:
    # Q40 as the maintainer answered it (2026-11-11, DECISIONS 110 item 5): INFO until a measured source is opened; the stand
    # trees' miss is still printed.  The 0.55-0.6 crown ratio worked out from this figure is dropped (it restates it).
    lowest_live_branch_m: [5.0, 7.0]
    at_top_height_m: [13.0, 15.0]
    source: "Hynynen & Niemistö (2009)"
    citation: "Hynynen, J., & Niemistö, P. (2009). Silviculture of silver birch in Finland. waldwissen.net, the forest knowledge site of the German-speaking forest research institutes."
    page_table: "web guide, no page; it cites no measurements (reports/birch_knowledge_base.md C1)"
    measures: "Lowest living branch of the leading trees at the first thinning, dominant height 13-15 m, in planted stands of 1,600 seedlings/ha: self-pruning clears stems to 5-7 m."
    scoring: info # a guide with no measurements; INFO until a measured source is opened (Q40)
    kind: "seen"
    kind_reason: "a candidate value was judged against it and kept off: shedding.limb_relative_light 0.6 was scored on the stand trees' lowest live branch at about 13.5 m (0.8 m base, 1.8 m with it; 0 of 10 seeds in 5-7 m) and left off (reports/overnight_log.md, young crowns round 2). Crown fix C was chosen with the same figure on the plots in view (clear_stem_natural_plots, tied here); whether the stand trees' reading was also quoted then is SUSPECTED, not traced. Seen, never independent"
    values_set: [shedding.limb_relative_light]
    tied_to: [stand_canopy.clear_stem_natural_plots]
    stands: "none: a guide"
    band_basis: "a guideline"
    source_opened: "the guide's page at waldwissen.net (reports/birch_knowledge_base.md C1); no measurements behind it"
    matched: false
    match_note: "planted at 1,600/ha; stand trees follow the Swedish thinning programme (1,800/ha first), so the density is near but not the source's"
    conditions:
      scenario: [stand-tree]
      mode: [managed]
      text: "Planted silver birch, 1,600 seedlings/ha, at the first thinning (dominant height 13-15 m). Read on stand trees in the first year their height is 13-15 m (a stand tree's height is the stand's dominant height)."

  clear_stem_natural_plots:
    # The same figure on natural plots: not the source's conditions, and crown fix C was chosen with it in view, so
    # reported only, never a pass (reports/design/2026-11-11_validation.md section 3, row A on natural plots).
    lowest_live_branch_m: [5.0, 7.0]
    at_top_height_m: [13.0, 15.0]
    source: "Hynynen & Niemistö (2009)"
    citation: "Hynynen, J., & Niemistö, P. (2009). Silviculture of silver birch in Finland. waldwissen.net."
    page_table: "web guide, no page; it cites no measurements (reports/birch_knowledge_base.md C1)"
    measures: "As clear_stem_at_first_thinning, read on natural plots: the lowest living branch of the 100 thickest trees per ha, in a year whose tree list has top height (the approved definition) at 13-15 m."
    scoring: info # reported only, never a pass
    kind: "tuned against"
    kind_reason: "crown fix C was adopted with the plots' lowest live branch at 13-15 m quoted against 5-7 m (DECISIONS 107: 3.22 to 5.36 m, 62 % inside)"
    values_set: [crown_frame.chase, crown_frame.limb_shoot_floor_m]
    tied_to: []
    stands: "none: a guide"
    band_basis: "a guideline"
    conditions:
      scenario: [plot]
      mode: [natural]
      text: "Natural plots from 16,000 stems/ha, not the source's planted 1,600/ha. Read from the plots' tree lists in a year top height is 13-15 m; a run with no such list has no value."

tree_allometry:
  site_index_curves:
    model: "Hossfeld IV difference form (polymorphic formulation of Kiviste)"
    source: "Eriksson, Johansson & Kiviste (1997)"
    doi: "10.1080/02827589709355396"
    citation: "Eriksson, H., Johansson, U., & Kiviste, A. (1997). A site-index model for pure and mixed stands of Betula pendula and Betula pubescens in Sweden. Scand. J. For. Res. 12:149-156."
    page_table: "Table 3 & Equation 4 (p. 152); VERIFY: the full text is paywalled and was not opened on 2026-11-02. Curve, parameters and variable definitions as reported by Elfving (2010), Growth modelling in the Heureka system, Appendix 9, p. 58, opened 2026-11-05"
    equation: "H2 = (H1 - 1.3 + d + r) / (2 + 4 beta T2^(-b2) / (H1 - 1.3 - d + r)) + 1.3, d = beta / asi^b2, r = sqrt((H1 - 1.3 - d)^2 + 4 beta (H1 - 1.3) / T1^b2); H1 = site index (m) at breast-height age T1 = reference_age_years, H2 = height (m) at breast-height age T2"
    parameters:
      asi: 7
      beta: 394
      b2: 1.387
    parameters_source: "Elfving (2010), Appendix 9, Table 1, p. 58: asi 7, beta 394, b2 -1.3870 (Elfving writes d = beta * asi^b2 with b2 negative; the equation above writes b2 positive). The same values are in the R package forester (github.com/Silviculturalist/forester, R/Eriksson_1997_height_trajectory_Sweden_BIrch.R). Eriksson et al.'s own table is still not opened. VERIFY"
    age_definition: "Breast-height age (T_1.3) where H(T_1.3 = 0) = 1.3 m. Elfving (2010) p. 58: 'For birch the equation gives height development above breast height as function of age at breast height.' Total age = T_1.3 + T13 (time_to_breast_height)."
    reference_age_years: 50 # breast-height age
    time_to_breast_height:
      rule: "T13 = 150/SIS"
      source: "Elfving (2010), Appendix 7, p. 56: 'For other broad-leaves (birch, aspen etc.) the following relation is applied: T13 = 150/SIS'. SIS is 'site index according to site factors, given as top height at age 100, m' (p. 55)."
      numerator: 150
      sis_total_age_years: 100
      sis_reading: "Elfving sets SIS from site factors for a site-indicative species (pp. 20, 38) and prints no conversion from birch site index (height at breast-height age 50) to SIS; p. 9 (Section 2.2, functions for mean height development in young stands) puts birch on the H100 pine scale ('Pend. birch: Pub. birch function with SI = H100pine + 1.5'), and p. 10 (Section 2.3, functions for age determination of young trees) gives 'H100pine for pine and birch'. Here SIS is this curve's own top height at total age 100, solved together with T13: SI20 25.08 m, 5.98 yr; SI26 29.93 m, 5.01 yr. VERIFY"
    swedish_boreal_range_m: [20.0, 26.0] # SI20 to SI26
    height_measure: "dominant height"
    # height_curve_at_100_thickest_per_ha | 100_thickest_per_ha | 100_tallest_per_ha | unconfirmed.
    # Elfving (2010) p. 58: "Top height is defined as the height according to the height
    # curve at the mean diameter of the 100 by diameter largest trees per hectare."  The
    # report names no curve, so a Naslund curve fitted to each plot, the form the maintainer chose
    # for the cross-check; the same trees' mean height is shown beside it (the maintainer,
    # 2026-11-06).  A stand-tree ensemble is scored by the mean of its seeds: a stand
    # tree's neighbours are copies of it, so it's never suppressed, and the spread
    # between seeds is chance, not dominance.
    dominant_height_definition: height_curve_at_100_thickest_per_ha
    kind: "by design"
    kind_reason: "the height driver grows the leader up to this curve at SI 23 (height_driver.site_index, TUNED to the middle of the band); held in 1,200 of 1,200 stand-tree seed-years (reports/birch_fresh_run_2026-11-09.md)"
    values_set: [height_driver.site_index]
    tied_to: []
    stands: "a curve fitted to Swedish stands"
    band_basis: "an equation, no band"
    conditions:
      scenario: [plot, stand-tree]
      mode: [natural, managed]
      age_years: [20, 60]
      age_definition: "total age = breast-height age + T13 (time_to_breast_height)"
      text: "Pure and mixed birch stands throughout Sweden (abstract). Stand-tree runs: dominant height is the tree's own height, its lattice neighbours being copies of it."

  bark_thickness:
    model_dbh: "under bark (wood only)"
    comparison_dbh: "over bark"
    source: "Hansen et al. (2023)"
    doi: "10.1080/02827581.2023.2243821"
    citation: "Hansen, E.H., Rahlf, J., Astrup, R., & Gobakken, T. (2023). Taper, volume, and bark thickness models for spruce, pine, and birch in Norway. Scand. J. For. Res. 38(6):413-428 (correction: Scand. J. For. Res. 39(4):254, DOI: 10.1080/02827581.2024.2358467)."
    implementation: "tools/bark.py (taperNOR R package 0.2.1 model)"
    formula: "double bark thickness (mm) = -0.48552367 + 0.04957885 * DBH_ob + 0.84676248 * d_ob"
    scoring: info # a conversion between model (under-bark) and field (over-bark) diameters, not a target
    kind: "by design"
    kind_reason: "a model input: the tools convert wood DBH to over-bark DBH with this equation (tools/bark.py); it is not a model output"
    values_set: []
    tied_to: []
    stands: "Norwegian NFI plots"
    band_basis: "a model input"
    conditions:
      scenario: [plot, stand-tree, single-tree]
      text: "Birch (B. pendula and B. pubescens) in Norwegian NFI plots."

  crown_width_open_grown:
    source: "Hemery, Savill & Pryor (2005)"
    doi: "10.1016/j.foreco.2005.05.014"
    citation: "Hemery, G.E., Savill, P.S., & Pryor, S.N. (2005). Applications of the crown diameter-stem diameter relationship for different species of broadleaved trees. Forest Ecology and Management 215:285-294."
    page_table: "Table 1 (p. 287)"
    formula: "Crown diameter (m) = 0.932 + 0.177 * DBH_over_bark_cm"
    scoring: info # paper paywalled, not opened on 2026-11-02: no range or spread seen, none added
    kind: "by design"
    kind_reason: "crown_frame caps a limb's reach at this crown (crown_frame.crown_a, crown_frame.crown_b; KNOWN_ISSUES.md, corrections to earlier reports)"
    values_set: [crown_frame.crown_a, crown_frame.crown_b]
    tied_to: []
    stands: "not stated: paper unopened"
    band_basis: "an equation, no band"
    conditions:
      scenario: [single-tree]
      mode: [open-grown]
      text: "Open-grown, solitary silver birch with unconstrained lateral branch expansion."

  foliage_biomass:
    source: "Repola (2008)"
    doi: "10.14214/sf.236"
    citation: "Repola, J. (2008). Biomass equations for birch in Finland. Silva Fennica 42(4):605-624."
    models:
      eq_12: "ln(foliage_kg) = -29.566 + 33.372 * (d_s / (d_s + 2)) where d_s = 2 + 1.25 * DBH, var=0.077 (DBH-only model)"
      eq_a6: "ln(foliage_kg) = -20.856 + 22.320 * (d_s / (d_s + 2)) + 2.819 * cr where d_s = 2 + 1.25 * DBH, cr = crown ratio, residual variance 0.044, between-stand variance 0.0108, Table A1 (DBH, H, CR model)"
    page_table: "Eq. 12 (p. 612), parameters Table 4 (p. 613), valid only for DBH 11-26 cm, N = 21 (p. 617); Eq. A6 (p. 621), parameters Table A1 (p. 623)"
    scoring: info # an equation; no pass range written
    kind: "seen"
    kind_reason: "pipe_model.huber_radius_exponent and pipe_model.huber_path_exponent are TUNED against cross-section per leaf area at breast height from Konopka 2023 and Repola 2008 Eq. 12 (labels.yaml; tools/fit_huber_exponent.py, tools/foliage_check.py), and KNOWN_ISSUES.md Phase 24 records that the trees' leaf area for their DBH then matched Eq. 12. Neither is in use at stem_theory stage 2, so seen, as stem wood is (DECISIONS 110 item 12). Tied to stand LAI: on the fresh run each plot tree's leaf dry mass over its leaf area is 51.5 g/m2 (spread 1.3 %, 1,334 trees) at 50 and 52.4 g/m2 (1.8 %, 948 trees) at 60 (the independent check of V1, 2026-11-11), so foliage is leaf area times a near-constant, and stand LAI is tuned (pipe_model.stem_theory.wind_speed_m_s)"
    values_set: [pipe_model.huber_radius_exponent, pipe_model.huber_path_exponent]
    tied_to: [stand_canopy.lai_baltic_chronosequence, stand_canopy.lai_hagemeier]
    stands: 24
    band_basis: "an equation, no band"
    source_opened: "Repola 2008 at the publisher (silvafennica.fi), 2026-11-11, by the validation design"
    matched: false
    match_note: "equations from 24 Finnish stands, mostly naturally regenerated and mixed with B. pubescens; valid for DBH 11-26 cm (p. 617)"
    conditions:
      scenario: [plot, stand-tree]
      mode: [natural, managed]
      text: "Sample trees from 24 stands across Finland, natural and managed, mostly naturally regenerated and mixed with B. pubescens, unthinned and heavily thinned plots included (same data as live_crown_ratio.managed_stand_empirical; natural added, Q35)."

  wood_basic_density:
    value_kg_m3: 530.0
    source: "Aosaar et al. (2016)"
    doi: "10.14214/sf.1628"
    citation: "Aosaar, J., et al. (2016). Biomass production and nitrogen balance of naturally afforested silver birch (Betula pendula Roth) stand in Estonia. Silva Fennica 50(4):1628."
    page_table: "Section 3.1 (p. 7): 'standing stem volume 161 m3 ha-1 (stemwood density 0.53 g cm-3)'; method p. 4"
    measures: "Stemwood density (dry mass / water-displacement volume, g cm-3 or kg m-3) for 17-year-old silver birch stand."
    scoring: info # a single value; also a model input
    kind: "by design"
    kind_reason: "a model input: wood is costed at this density (resource.leaf_costs.wood_basic_density_kg_m3)"
    values_set: [resource.leaf_costs.wood_basic_density_kg_m3]
    tied_to: []
    stands: 1
    band_basis: "a model input"
    conditions:
      scenario: [plot, stand-tree]
      age_years: [17, 17]
      text: "17-year-old silver birch stand, Estonia."

  carbon_fraction:
    value: 0.48
    source: "Thomas & Martin (2012)"
    doi: "10.3390/f3020332"
    citation: "Thomas, S.C., & Martin, A.R. (2012). Carbon content of tree tissues: a synthesis. Forests 3(2):332-352."
    page_table: "Table 2 (p. 337)"
    measures: "Carbon concentration in wood dry matter of temperate/boreal angiosperms: 48.8 +/- 0.6 % observed; 48 +/- 2 % is the IPCC value the table reprints."
    scoring: info # a model input, not a model output
    kind: "by design"
    kind_reason: "a model input (resource.leaf_costs.carbon_fraction)"
    values_set: [resource.leaf_costs.carbon_fraction]
    tied_to: []
    stands: "a synthesis"
    band_basis: "a model input"
    conditions:
      scenario: [plot, stand-tree, single-tree, single-seedling]
      text: "Wood of temperate/boreal angiosperms."

  critical_turning_moment:
    value_knm_per_m3: 101.0
    source: "Krišāns et al. (2022)"
    doi: "10.3390/f13010127"
    citation: "Krišāns, O., Čakša, L., Matisons, R., Rust, S., Elferts, D., Seipulis, A., & Jansons, Ā. (2022). A Static Pulling Test Is a Suitable Method for Comparison of the Loading Resistance of Silver Birch (Betula pendula Roth.) between Urban and Peri-Urban Forests. Forests 13(1):127."
    page_table: "Tables 1-2 (pp. 4-6)"
    measures: "My line through two published averages, not a published regression (Q35): least squares through the origin over the two birch sites' means, stem volume 0.67 and 1.43 m3 (Table 1) against basal bending moment at secondary failure, all by uprooting, 46.9 and 154.3 kN m (Table 2), gives M_crit = 101 kN m per m3 of stem. The paper's own linear mixed model (Table 3) has an intercept and a species term; this line isn't it."
    scoring: info # a regression coefficient; no pass range written
    kind: "by design"
    kind_reason: "a model input: the anchorage uses this line (a line through two site means, not a published regression, Q35)"
    values_set: []
    tied_to: []
    stands: 2
    band_basis: "a model input"
    conditions:
      scenario: [plot, stand-tree, single-tree]
      text: "Silver birch in urban and peri-urban forests, Latvia."

  branch_biomass_repola:
    # DECISIONS 110 item 6a: the branch row restated against Repola's Eq. A3 at the tree's own crown length, beside
    # Eq. 9, and labelled tuned against.  The coefficients are Repola's, as read by the branch-wood design at the
    # publisher (reports/design/2026-11-11_branch_wood.md section 1); coded by the T1 tooling in tools/m3_wood.py
    # (repola_a3, branch tools-logging), which tools/scorecard.py uses once it is merged.
    source: "Repola (2008)"
    doi: "10.14214/sf.236"
    citation: "Repola, J. (2008). Biomass equations for birch in Finland. Silva Fennica 42(4):605-624."
    page_table: "Eq. 9, Table 4 (p. 613); Eq. A3, Table A1 (p. 623); A3 recommended for crown parts (p. 618); living branches include bark (p. 608); sample DBH 2.5-38.0 cm (Table 2, p. 608)"
    models:
      eq_a3: "ln(branch_kg) = -5.067 + 14.614 * d_s / (d_s + 12) - 5.074 * h / (h + 12) + 0.092 * crown_length_m, bias exp((0.01508 + 0.05663) / 2), d_s = 2 + 1.25 * DBH over bark"
      eq_9: "ln(branch_kg) = -4.152 + 15.874 * d_s / (d_s + 16) - 4.407 * h / (h + 10), bias exp((0.02733 + 0.07662) / 2)"
    dbh_range_cm: [2.5, 38.0]
    measures: "Living branches (wood and bark, no foliage) of the stand tree over Repola's at its own DBH over bark, height and crown length.  The model's branches are wood only, so the true gap is wider than printed."
    scoring: info # an equation, no pass range written
    kind: "tuned against"
    kind_reason: "pipe_model.branch_sapwood_senescence 0.30 says TUNED, against Repola's branch wood (test A, Eq. 9: 38.5, 52.6 kg against 46.1, 59.2 at 50, 60); never retuned after the crown changed"
    values_set: [pipe_model.branch_sapwood_senescence, pipe_model.branch_sapwood_thick_m]
    tied_to: []
    stands: 24
    band_basis: "equation's between-stand spread"
    conditions:
      scenario: [stand-tree]
      text: "Sample trees from 24 Finnish stands, natural and managed, about a third of the birch B. pubescens. Stand trees only: plot tree lists save no wood."

  stem_biomass_repola:
    source: "Repola (2008)"
    doi: "10.14214/sf.236"
    citation: "Repola, J. (2008). Biomass equations for birch in Finland. Silva Fennica 42(4):605-624."
    page_table: "Eq. 7, Table 4 (p. 613); stem wood excludes bark"
    models:
      eq_7: "ln(stem_kg) = -4.879 + 9.651 * d_s / (d_s + 12) + 1.012 * ln(h), bias exp((0.00263 + 0.00544) / 2), d_s = 2 + 1.25 * DBH over bark"
    dbh_range_cm: [2.5, 38.0]
    measures: "Stem wood of the stand tree over Repola's at its own DBH over bark and height."
    scoring: info # an equation, no pass range written
    kind: "seen"
    kind_reason: "crown_frame.twig_bud_every was TUNED against crown ratio and stem wood with this equation on the table (species file); today's defaults don't read it (crown_frame.earned), so the row is seen, not clean (DECISIONS 110 item 12)"
    values_set: [crown_frame.twig_bud_every]
    tied_to: []
    stands: 24
    band_basis: "equation's between-stand spread"
    conditions:
      scenario: [stand-tree]
      text: "As branch_biomass_repola."


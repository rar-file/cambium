    height_cm: [15, 35]
    lai_range: [0.4, 2.0]
    ground_light_transmittance_pct: [20.0, 40.0]
    source: "Aubin, Beaudet & Messier (2000, Can. J. For. Res. 30:168); SMEAR II Hyytiälä data; Ring & Sikström (2024, Silva Fennica 58:23056)"
